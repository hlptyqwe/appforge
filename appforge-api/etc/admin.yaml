Name: admin-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 10000

Jwt:
  AccessSecret: change-me-in-etcd
  AccessExpire: 86400

SystemRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: system.rpc

CoreRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: core.rpc

BuilderRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: builder.rpc
  Middlewares:
    Duration: false

# Local Agent Artifact 短时票据；本地开发请按实际 Redis 地址调整。
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: ""

# 仅用于本地开发。生产环境必须由 Secret Manager 注入独立的 32 字节 Base64 密钥。
SigningSecrets:
  MasterKeyBase64: YXBwZm9yZ2UtZGV2LXNpZ25pbmcta2V5LTAwMDAwMSE=

# ClientId和ClientSecret必须由部署环境的Secret Manager覆盖；留空时连接按钮不可用。
SourceOAuth:
  SuccessRedirect: http://localhost:5174/platform/developer?tab=source
  WebhookBaseURL: http://localhost:8888/public/v1/source-webhooks
  GitHub:
    ClientId: ""
    ClientSecret: ""
    AuthorizeURL: https://github.com/login/oauth/authorize
    TokenURL: https://github.com/login/oauth/access_token
    ApiBaseURL: https://api.github.com
    RedirectURL: http://localhost:8888/public/v1/source-oauth/callback

  GitLab:
    ClientId: ""
    ClientSecret: ""
    AuthorizeURL: https://gitlab.com/oauth/authorize
    TokenURL: https://gitlab.com/oauth/token
    ApiBaseURL: https://gitlab.com/api/v4
    RedirectURL: http://localhost:8888/public/v1/source-oauth/callback

SourceTriggerWorker:
  Enabled: true
  WorkerId: source-trigger-worker-local
  PollInterval: 2s
  LeaseSeconds: 600

# Stripe密钥必须由部署环境的Secret Manager覆盖；留空时在线结账不可用，人工合同仍可用。
Billing:
  StripeSecretKey: ""
  StripeWebhookSecret: ""
  StripeAPIBaseURL: https://api.stripe.com
  SuccessURL: http://localhost:5174/platform/billing?checkout=success
  CancelURL: http://localhost:5174/platform/billing?checkout=cancelled

LocalAgentGateway:
  Enabled: false
  ListenOn: 0.0.0.0:9443
  ServerCertificate: ""
  ServerPrivateKey: ""
  ClientCACertificate: ""

# Dedicated/Private交付启用；开发环境关闭。
OfflineLicense:
  Enabled: false
  LicenseFile: ""
  PublicKeyFile: ""
  StateFile: ""
  DeploymentId: ""
  DeploymentMode: ""
  ClockRollbackTolerance: 5m

Deployment:
  DeploymentId: local-development
  DeploymentMode: saas
  ProductVersion: 0.0.0-dev
  TargetSchemaVersion: 20260815_113_v7_air_gapped
  MaxVersionSkew: 1
  AgentProtocolCurrent: 3
  AgentProtocolMinimum: 2

# 仅记录会修改数据的后台操作；查询请求不写操作日志。
Audit:
  SIEM:
    Enabled: false
    Endpoint: ""
    BearerTokenFile: ""
    CACertificate: ""
    Timeout: 10s
    QueueSize: 1000
    MaxAttempts: 5
    RetryBackoff: 500ms
    AllowHTTP: false
  Routes:
    - Method: POST
      Path: /admin/system/users
    - Method: PUT
      Path: /admin/system/users
    - Method: DELETE
