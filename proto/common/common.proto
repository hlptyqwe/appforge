syntax = "proto3";

package common;

option go_package = "appforge/proto/common;common";

message Empty {}

message RespBase {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  bool has_next = 4;
  bool has_prev = 5;
  int64 next_cursor = 6;
  int64 prev_cursor = 7;
}

message PageReq {
  int64 cursor = 1;
  int64 limit = 2;
  int64 count = 3; // 已知总数；<=0 时服务端按需重新统计
}

message TokenInfo {
  string access_token = 1;
  string refresh_token = 2;
  int64 expire_time = 3;
}

message TimeRange {
  int64 start_time = 1;
  int64 end_time = 2;
}

// 是否
enum YesNo {
  YES_NO_UNKNOWN = 0;
  YES_NO_YES = 1; // 是
  YES_NO_NO = 2; // 否
}

enum Enable {
  ENABLE_UNKNOWN = 0; // 未知
  ENABLE_ENABLED = 1; // 启用
  ENABLE_DISABLED = 2; // 禁用
}

// 展示/操作开关
enum Switch {
  SWITCH_UNKNOWN = 0;
  SWITCH_ON = 1; // 开启/展示
  SWITCH_OFF = 2; // 关闭/隐藏
}
