// APK签名配置。
// 密码密文只允许写入，不通过查询接口返回。
message SigningConfig {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  string name = 4;
  string keystore_object_key = 5;
  string key_alias = 6;
  string secret_ref = 7;
  int64 status = 8; // 1启用 2停用
  int64 last_verified_at = 9;
  int64 create_by = 10;
  int64 create_time = 11;
  int64 update_time = 12;
  int64 keystore_object_id = 13; // 签名文件存储对象ID
  string certificate_sha256 = 14; // 签名证书SHA-256指纹
}

message BuildTask {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  int64 version_id = 4;
  int64 channel_id = 5;
  int64 signing_config_id = 6;
  string channel_code = 7;
  int64 version_code = 8;
  string version_name = 9;
  BuildTaskStatus status = 10; // 构建任务状态
  string builder_id = 11;
  int32 builder_attempt = 12;
  int32 priority = 13;
  string apk_url = 14;
  string apk_sha256 = 15;
  int64 apk_size = 16;
  string log_url = 17;
  string error_message = 18;
  int64 queued_at = 19;
  int64 start_time = 20;
  int64 finish_time = 21;
  int64 create_by = 22;
  int64 create_time = 23;
  int64 update_time = 24;
  string source_apk_url = 25; // 构建时使用的原始APK地址快照
  string build_config_json = 26; // 构建时使用的构建配置快照
  int64 source_apk_object_id = 27; // 原始APK对象ID快照
  int64 apk_object_id = 28; // 构建产物APK对象ID
  int64 log_object_id = 29; // 构建日志对象ID
  int64 branding_profile_id = 30; // 构建时使用的品牌配置ID
  int32 branding_revision = 31; // 构建时使用的品牌修订号
  string branding_snapshot_json = 32; // 构建时固化的品牌配置快照JSON
  int64 white_label_product_id = 33; // V3白标产品ID
  int32 template_revision = 34; // V3模板修订号
  string template_snapshot_json = 35; // V3模板和产品不可变快照JSON
  string pool_code = 36; // V4目标构建池编码
  string cache_key = 37; // V4不可变输入缓存键
  int64 cache_entry_id = 38; // V4命中的缓存条目ID
  bool cache_hit = 39; // V4是否命中缓存
  int64 cancel_requested_at = 40; // V4取消请求时间，Unix毫秒
  int64 cancelled_at = 41; // V4取消完成时间，Unix毫秒
  string cancel_reason = 42; // V4取消原因
  int64 retry_of_task_id = 43; // V4重试来源任务ID
}

// 私有对象存储元数据。
message StorageObject {
  int64 id = 1; // 存储对象ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 关联应用ID，上传时允许为0
  StorageObjectType object_type = 4; // 对象类型
  string object_key = 5; // 私有对象存储Key
  string original_name = 6; // 用户上传时的原始文件名
  string content_type = 7; // 对象内容类型
  int64 size_bytes = 8; // 对象大小，单位字节
  string sha256 = 9; // 对象SHA-256
  StorageObjectStatus status = 10; // 生命周期状态
  int64 create_by = 11; // 创建人ID
  int64 create_time = 12; // 创建时间，Unix毫秒
  int64 update_time = 13; // 更新时间，Unix毫秒
}

// 应用品牌白标配置。
message BrandingProfile {
  int64 id = 1; // 品牌配置ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  string profile_name = 4; // 品牌配置名称
  string app_name = 5; // 构建后的应用展示名称
  int64 logo_object_id = 6; // 品牌Logo存储对象ID
  int64 splash_object_id = 7; // 品牌启动图存储对象ID
  string api_host = 8; // 构建后的业务API地址
  BrandingRewriteMode rewrite_mode = 9; // 品牌资源改写模式
  string launcher_icon_target = 10; // Launcher图标资源目标
  string splash_resource_target = 11; // 启动图资源目标
  string runtime_config_json = 12; // 运行时契约扩展配置JSON
  BrandingProfileStatus status = 13; // 品牌配置状态
  int32 revision = 14; // 品牌配置修订号
  int64 create_by = 15; // 创建人ID
  int64 create_time = 16; // 创建时间，Unix毫秒
  int64 update_time = 17; // 更新时间，Unix毫秒
}

// 品牌兼容性预检记录。
message BrandingPreflight {
  int64 id = 1; // 预检记录ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  int64 branding_profile_id = 4; // 品牌配置ID
  int32 branding_revision = 5; // 预检时的品牌修订号
  int64 version_id = 6; // 被检查的应用版本ID
  BrandingPreflightStatus status = 7; // 预检状态
  string report_json = 8; // 结构化预检报告JSON
  string source_apk_sha256 = 9; // 源APK SHA-256快照
  string toolchain_version = 10; // 预检工具链版本
  int64 start_time = 11; // 预检开始时间，Unix毫秒
  int64 finish_time = 12; // 预检完成时间，Unix毫秒
  int64 create_by = 13; // 创建人ID
  int64 create_time = 14; // 创建时间，Unix毫秒
  int64 update_time = 15; // 更新时间，Unix毫秒
  string builder_id = 16; // 当前预检Builder节点ID
  int32 builder_attempt = 17; // 预检领取代次
  int64 lease_until = 18; // Builder租约到期时间，Unix毫秒
}

// V3白标模板。
message WhiteLabelTemplate {
  int64 id = 1; // 模板ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  string template_code = 4; // 模板编码
  string template_name = 5; // 模板名称
  int64 source_version_id = 6; // 源应用版本ID
  string parameter_schema_json = 7; // 参数JSON Schema
  string compatibility_rules_json = 8; // 兼容规则JSON
  WhiteLabelTemplateStatus status = 9; // 模板状态
  int32 published_revision = 10; // 当前发布修订号
  int64 create_by = 11; // 创建人ID
  int64 create_time = 12; // 创建时间，Unix毫秒
  int64 update_time = 13; // 更新时间，Unix毫秒
}

// V3白标模板不可变修订。
message WhiteLabelTemplateRevision {
  int64 id = 1; // 修订ID
  int64 tenant_id = 2; // 所属租户ID
  int64 template_id = 3; // 模板ID
  int32 revision = 4; // 修订号
  string package_name_rule_json = 5; // 动态包名规则JSON
  string manifest_patch_json = 6; // Manifest声明式补丁JSON
  string resource_patch_json = 7; // 资源声明式补丁JSON
  string extension_files_json = 8; // 受控扩展文件JSON
  string expected_artifacts_json = 9; // 产物验收规则JSON
  string checksum = 10; // 规范化修订内容SHA-256
  WhiteLabelRevisionStatus status = 11; // 修订状态
  int64 create_by = 12; // 创建人ID
  int64 create_time = 13; // 创建时间，Unix毫秒
}

// V3白标产品。
message WhiteLabelProduct {
  int64 id = 1; // 产品ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  string product_code = 4; // 产品编码
  string product_name = 5; // 产品名称
  int64 template_id = 6; // 模板ID
  int32 template_revision = 7; // 模板修订号
  int64 branding_profile_id = 8; // 品牌配置ID
  string package_name = 9; // Android applicationId
  int64 signing_config_id = 10; // 独立签名配置ID
  string parameter_values_json = 11; // 模板参数值JSON
  WhiteLabelProductStatus status = 12; // 产品状态
  int64 create_by = 13; // 创建人ID
  int64 create_time = 14; // 创建时间，Unix毫秒
  int64 update_time = 15; // 更新时间，Unix毫秒
}

// V4 Builder集群节点。
message BuilderNode {
  int64 id = 1; // 节点ID
  string node_code = 2; // 节点唯一编码
  string pool_code = 3; // 所属构建池编码
  string endpoint = 4; // 节点管理端点或实例标识
  BuilderNodeStatus status = 5; // 节点健康状态
  BuilderDrainStatus drain_status = 6; // 节点排空状态
  int32 max_concurrency = 7; // 最大并发执行数
  int32 running_count = 8; // 当前执行数
  int32 cpu_capacity = 9; // CPU容量，单位毫核
  int64 memory_capacity = 10; // 内存容量，单位字节
  int64 disk_capacity = 11; // 构建磁盘总容量，单位字节
  int64 disk_free = 12; // 构建磁盘剩余容量，单位字节
  string toolchain_version = 13; // APK构建工具链版本
  int32 build_protocol_version = 14; // 构建协议版本
  string capability_json = 15; // 节点能力白名单JSON
  int32 consecutive_failures = 16; // 连续失败次数
  string last_error_message = 17; // 最近错误摘要
  int64 last_heartbeat_at = 18; // 最近心跳时间，Unix毫秒
  int64 create_time = 19; // 创建时间，Unix毫秒
  int64 update_time = 20; // 更新时间，Unix毫秒
}

// V4 构建并发与公平调度策略。
message BuildConcurrencyPolicy {
  int64 id = 1; // 策略ID
  int64 tenant_id = 2; // 租户ID，0表示全局作用域
  int64 app_id = 3; // 应用ID，0表示非应用作用域
  string pool_code = 4; // 构建池编码
  int32 max_concurrency = 5; // 作用域最大并发数
  int32 fair_weight = 6; // 租户公平调度权重
  int32 max_priority = 7; // 允许提交的最高普通优先级
  BuildPolicyStatus status = 8; // 策略状态
  int64 create_by = 9; // 创建人ID
  int64 create_time = 10; // 创建时间，Unix毫秒
  int64 update_time = 11; // 更新时间，Unix毫秒
}

// V4 构建缓存条目。
message BuildCacheEntry {
  int64 id = 1; // 缓存条目ID
  int64 tenant_id = 2; // 所属租户ID
  BuildCacheScope cache_scope = 3; // 缓存作用域
  string cache_key = 4; // 不可变输入缓存键
  string toolchain_version = 5; // 生成缓存的工具链版本
  int32 build_protocol_version = 6; // 生成缓存的构建协议版本
  string input_digest = 7; // 规范化输入摘要
  int64 artifact_object_id = 8; // 缓存产物对象ID
  string artifact_sha256 = 9; // 缓存产物SHA-256
  int64 size_bytes = 10; // 缓存产物大小，单位字节
  int64 hit_count = 11; // 累计命中次数
  BuildCacheStatus status = 12; // 缓存状态
  int64 expires_at = 13; // 过期时间，Unix毫秒
  int64 last_hit_at = 14; // 最近命中时间，Unix毫秒
  int64 create_time = 15; // 创建时间，Unix毫秒
  int64 update_time = 16; // 更新时间，Unix毫秒
}

// V4 构建调度结构化事件。
message BuildSchedulerEvent {
  int64 id = 1; // 调度事件ID
  int64 tenant_id = 2; // 关联租户ID
  int64 app_id = 3; // 关联应用ID
  int64 task_id = 4; // 关联构建任务ID
  string node_code = 5; // 关联Builder节点编码
  string pool_code = 6; // 构建池编码
  BuildSchedulerEventType event_type = 7; // 调度事件类型
  string reason_code = 8; // 结构化调度原因编码
  string decision_json = 9; // 调度输入、限制和结果JSON
  int64 create_time = 10; // 事件时间，Unix毫秒
}

// V4 构建集群运行指标与告警摘要。
message BuildClusterMetrics {
  string pool_code = 1; // 构建池编码
  int32 period_minutes = 2; // 统计窗口分钟数
  int64 online_nodes = 3; // 在线节点数
  int64 offline_nodes = 4; // 离线或隔离节点数
  int64 draining_nodes = 5; // 排空中节点数
  int64 total_slots = 6; // 节点总并发槽位数
  int64 running_slots = 7; // 当前运行槽位数
  int64 disk_capacity = 8; // 节点磁盘总容量，单位字节
  int64 disk_free = 9; // 节点磁盘剩余容量，单位字节
  int64 queued_tasks = 10; // 当前排队任务数
  int64 running_tasks = 11; // 当前执行任务数
  int64 completed_tasks = 12; // 窗口内完成任务数
  int64 success_tasks = 13; // 窗口内成功任务数
  int64 failed_tasks = 14; // 窗口内失败任务数
  int64 cancelled_tasks = 15; // 窗口内取消任务数
  int64 average_queue_ms = 16; // 窗口内平均排队时长，单位毫秒
  int64 average_build_ms = 17; // 窗口内平均构建时长，单位毫秒
  double success_rate = 18; // 窗口内成功率，取值0到1
  int64 cache_hit_tasks = 19; // 窗口内缓存命中任务数
  double cache_hit_rate = 20; // 窗口内缓存命中率，取值0到1
  int64 active_cache_entries = 21; // 当前有效缓存条目数
  int64 active_cache_bytes = 22; // 当前有效缓存占用字节数
  int64 lease_recovery_count = 23; // 窗口内租约恢复次数
  int64 cache_validation_failure_count = 24; // 窗口内缓存校验失败次数
  int64 oldest_queued_ms = 25; // 最老排队任务等待时长，单位毫秒
  repeated string alerts = 26; // 当前告警代码列表
}

// V5 Open API凭证；不包含Secret或Secret摘要。
message OpenApiCredential {
  int64 id = 1; // 凭证ID
  int64 tenant_id = 2; // 所属租户ID
  string credential_name = 3; // 凭证名称
  string key_id = 4; // 公开Key标识
  repeated OpenApiScope scopes = 5; // 授权Scope列表
  repeated int64 app_ids = 6; // 允许访问的应用ID，空列表表示全部应用
  repeated string ip_allowlist = 7; // 允许访问的IP或CIDR，空列表表示不限制
  int32 rate_limit_per_minute = 8; // 每分钟请求上限
  OpenApiCredentialStatus status = 9; // 凭证状态
  int64 expires_at = 10; // 到期时间，Unix毫秒，0表示长期有效
  int64 grace_expires_at = 11; // 轮换过渡截止时间，Unix毫秒
  int64 rotated_from_id = 12; // 轮换来源凭证ID
  int64 last_used_at = 13; // 最近成功使用时间，Unix毫秒
  int64 create_by = 14; // 创建人ID
  int64 create_time = 15; // 创建时间，Unix毫秒
  int64 update_time = 16; // 更新时间，Unix毫秒
}

// V5 一次性返回的Open API凭证Secret。
message OpenApiCredentialSecret {
  OpenApiCredential credential = 1; // 凭证元数据
  string api_key = 2; // 完整API Key，仅本次响应返回
}

// V5 Open API认证上下文。
message OpenApiAuthContext {
  int64 credential_id = 1; // 凭证ID
  int64 tenant_id = 2; // 所属租户ID
  string key_id = 3; // 公开Key标识
  repeated OpenApiScope scopes = 4; // 授权Scope
  repeated int64 app_ids = 5; // 应用范围
  int32 rate_limit_per_minute = 6; // 每分钟请求上限
}

