// V6租户当前订阅。
message TenantSubscription {
  int64 id = 1; // 订阅ID
  int64 tenant_id = 2; // 租户ID
  int64 plan_id = 3; // 当前套餐版本ID
  int32 plan_version = 4; // 固化套餐版本号
  TenantSubscriptionStatus status = 5; // 订阅状态
  TenantSubscriptionSource source = 6; // 订阅来源
  string external_customer_id = 7; // 支付客户ID
  string external_subscription_id = 8; // 支付订阅ID
  int64 current_period_start = 9; // 周期开始Unix毫秒
  int64 current_period_end = 10; // 周期结束Unix毫秒
  bool cancel_at_period_end = 11; // 是否周期末取消
  int64 grace_until = 12; // 宽限截止Unix毫秒
  int64 pending_plan_id = 13; // 周期末待切换套餐ID
  int32 pending_plan_version = 14; // 周期末待切换套餐版本
  int64 create_time = 15; // 创建时间Unix毫秒
  int64 update_time = 16; // 更新时间Unix毫秒
}

// V6租户当前权益。
message TenantEntitlement {
  int64 id = 1; // 权益ID
  int64 tenant_id = 2; // 租户ID
  int64 plan_id = 3; // 基础套餐版本ID
  int32 plan_version = 4; // 基础套餐版本号
  int64 builds_per_cycle = 5; // 周期构建次数
  int32 max_build_concurrency = 6; // 最大构建并发
  int64 storage_bytes = 7; // 存储额度字节
  int64 max_upload_bytes = 8; // 单文件上传上限字节
  int32 team_seats = 9; // 团队席位
  int32 api_rate_limit = 10; // Open API每分钟上限
  bool charge_failed_build = 11; // 失败构建是否计量
  bool charge_cache_hit = 12; // 缓存命中是否计量
  bool charge_retry_build = 13; // 重试构建是否计量
  string override_json = 14; // 人工覆盖JSON
  int64 valid_from = 15; // 生效时间Unix毫秒
  int64 valid_until = 16; // 失效时间Unix毫秒
  TenantEntitlementStatus status = 17; // 权益状态
  int64 revision = 18; // 权益修订号
}

// 查询V6租户账务请求；tenant_id为0时使用调用上下文租户。
message TenantBillingReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
}

// V6租户订阅和权益响应。
message TenantBillingResp {
  common.RespBase base = 1; // 通用响应
  TenantSubscription subscription = 2; // 当前订阅
  TenantEntitlement entitlement = 3; // 当前权益
  BillingPlan plan = 4; // 当前不可变套餐版本
}

// 管理端创建或更新V6人工合同订阅请求。
message UpsertManualSubscriptionReq {
  int64 tenant_id = 1; // 目标租户ID
  int64 plan_id = 2; // 套餐版本ID
  int64 period_start = 3; // 周期开始Unix毫秒
  int64 period_end = 4; // 周期结束Unix毫秒
  int64 grace_until = 5; // 可选宽限截止Unix毫秒
  string override_json = 6; // 可选权益覆盖JSON
  string contract_reference = 7; // 人工合同编号
}

// V6订阅套餐变更请求。
message ChangeTenantSubscriptionReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  int64 plan_id = 2; // 新套餐版本ID
  SubscriptionChangeMode mode = 3; // 生效方式
}

// V6订阅取消请求。
message CancelTenantSubscriptionReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  bool immediately = 2; // 是否立即取消，否则周期末取消
}

// V6额度预占请求。
message ReserveQuotaReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  QuotaMetric metric = 2; // 额度指标
  int64 quantity = 3; // 预占数量
  string resource_type = 4; // 来源资源类型
  int64 resource_id = 5; // 来源资源ID，创建前可为0
  string idempotency_key = 6; // 预占幂等键
  int64 ttl_seconds = 7; // 预占有效秒数
}

// V6额度预占结果。
message QuotaReservation {
  int64 id = 1; // 预占ID
  int64 tenant_id = 2; // 租户ID
  QuotaMetric metric = 3; // 额度指标
  int64 quantity = 4; // 预占数量
  string resource_type = 5; // 来源资源类型
  int64 resource_id = 6; // 来源资源ID
  string idempotency_key = 7; // 幂等键
  string period_key = 8; // 周期键YYYY-MM
  QuotaReservationStatus status = 9; // 预占状态
  int64 expires_at = 10; // 过期时间Unix毫秒
  int64 used_quantity = 11; // 当前已使用数量
  int64 reserved_quantity = 12; // 当前生效预占数量
  int64 limit_quantity = 13; // 当前限额，-1不限量
}

// V6额度预占响应。
message QuotaReservationResp {
  common.RespBase base = 1; // 通用响应
  QuotaReservation data = 2; // 预占结果
}

// V6额度确认或释放请求。
message QuotaReservationActionReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  QuotaMetric metric = 2; // 额度指标
  string idempotency_key = 3; // 预占幂等键
  int64 resource_id = 4; // 最终资源ID
  BillingUsageMetric usage_metric = 5; // 确认时写入的用量指标，释放时忽略
  string usage_metadata_json = 6; // 确认时用量元数据JSON
}

// V6幂等用量入账请求。
message RecordUsageReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  BillingUsageMetric metric = 2; // 用量指标
  int64 quantity = 3; // 增量，调整账可为负数
  string resource_type = 4; // 来源资源类型
  int64 resource_id = 5; // 来源资源ID
  string idempotency_key = 6; // 指标内幂等键
  int64 occurred_at = 7; // 发生时间Unix毫秒，0表示当前时间
  string metadata_json = 8; // 计量规则或调整原因JSON
}

// V6单项用量汇总。
message UsageMetricSummary {
  BillingUsageMetric metric = 1; // 用量指标
  int64 used_quantity = 2; // 账本汇总用量
  int64 reserved_quantity = 3; // 生效预占数量
  int64 limit_quantity = 4; // 当前权益限额，-1不限量
  int32 usage_percent = 5; // 使用百分比，不限量为0
}

// 查询V6用量请求。
message BillingUsageReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  string period_key = 2; // 周期键YYYY-MM，空表示当前订阅周期
}

// V6用量汇总响应。
message BillingUsageResp {
  common.RespBase base = 1; // 通用响应
  string period_key = 2; // 周期键YYYY-MM
  repeated UsageMetricSummary data = 3; // 各指标用量
}

// V6不可变账单项。
message InvoiceItem {
  int64 id = 1; // 账单项ID
  int64 invoice_id = 2; // 账单ID
  string line_key = 3; // 不可变行键
  int32 item_type = 4; // 账单项类型枚举值
  string description = 5; // 说明
  BillingUsageMetric metric = 6; // 用量指标
  int64 quantity = 7; // 数量
  int64 unit_amount = 8; // 单价整数
  int64 amount = 9; // 行金额整数
}

// V6不可变账单。
message Invoice {
  int64 id = 1; // 账单ID
  int64 tenant_id = 2; // 租户ID
  string invoice_no = 3; // 平台账单号
  string external_invoice_id = 4; // 支付提供商账单ID
  InvoiceStatus status = 5; // 账单状态
  string currency = 6; // ISO 4217币种
  int64 subtotal_amount = 7; // 税前小计整数
  int64 discount_amount = 8; // 折扣金额整数
  int64 tax_amount = 9; // 税费整数
  int64 total_amount = 10; // 应付总额整数
  int64 paid_amount = 11; // 已支付金额整数
  int64 refunded_amount = 12; // 已退款金额整数
  int64 period_start = 13; // 周期开始Unix毫秒
  int64 period_end = 14; // 周期结束Unix毫秒
  int64 due_at = 15; // 到期时间Unix毫秒
  int64 paid_at = 16; // 支付时间Unix毫秒
  repeated InvoiceItem items = 17; // 不可变账单项
  int64 create_time = 18; // 创建时间Unix毫秒
}

// 查询V6账单列表请求。
message InvoiceListReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  InvoiceStatus status = 2; // 状态筛选，未知表示全部
  int32 page = 3; // 页码，从1开始
  int32 page_size = 4; // 每页数量
}

// V6账单列表响应。
message InvoiceListResp {
  common.RespBase base = 1; // 通用响应
  repeated Invoice data = 2; // 账单列表
  int64 total = 3; // 总数
}

// 已完成签名验证并标准化的V6支付回调请求。
message ApplyBillingWebhookReq {
  string provider = 1; // 支付提供商：stripe
  string provider_event_id = 2; // 供应商事件ID
  string event_type = 3; // 供应商事件类型
  int64 event_created_at = 4; // 供应商事件创建Unix秒
  string payload_json = 5; // 原始JSON，仅在Core内加密保存
  int64 tenant_id = 6; // 事件元数据中的租户ID
  int64 plan_id = 7; // 事件元数据中的套餐版本ID
  string external_customer_id = 8; // 供应商客户ID
  string external_subscription_id = 9; // 供应商订阅ID
  string external_invoice_id = 10; // 供应商账单ID
  string external_transaction_id = 11; // 供应商支付、退款或争议ID
  string currency = 12; // ISO 4217币种
  int64 amount = 13; // 事件金额，最小货币单位整数
  int64 period_start = 14; // 订阅或账单周期开始Unix秒
  int64 period_end = 15; // 订阅或账单周期结束Unix秒
  bool cancel_at_period_end = 16; // 是否周期末取消
  string failure_code = 17; // 失败结构化代码
  string failure_message = 18; // 失败脱敏摘要
}

// V7 Local Agent预定义能力，能力键不能表示任意命令。
message LocalAgentCapability {
  string capability_key = 1; // 能力键，例如android.api、abi或signing.remote
  string capability_value = 2; // 能力版本或约束值
}

// V7 Local Agent公开客户端证书信息，不包含私钥。
message LocalAgentCertificate {
  int64 id = 1; // 证书记录ID
  string serial_number = 2; // X.509证书序列号
  string fingerprint_sha256 = 3; // 证书DER SHA-256指纹
  string certificate_pem = 4; // 公开客户端证书PEM
  LocalAgentCertificateStatus status = 5; // 证书状态
  int64 not_before = 6; // 生效时间Unix毫秒
  int64 not_after = 7; // 失效时间Unix毫秒
}

// V7 Local Builder Agent。
message LocalAgent {
  int64 id = 1; // Agent ID
  int64 tenant_id = 2; // 所属租户ID
  string agent_code = 3; // 租户内稳定编码
  string agent_name = 4; // 展示名称
  string pool_code = 5; // 构建池编码
  LocalAgentStatus status = 6; // 运行状态
  LocalAgentDrainStatus drain_status = 7; // 排空状态
  int32 protocol_version = 8; // 协议版本
  string agent_version = 9; // Agent语义化版本
  HybridArtifactMode artifact_mode = 10; // Artifact模式
  string customer_storage_ref = 11; // 客户存储Secret引用
  repeated int64 allowed_app_ids = 12; // 允许构建的应用ID
  repeated LocalAgentCapability capabilities = 13; // 预定义能力
  string certificate_serial = 14; // 当前证书序列号
  int64 certificate_not_after = 15; // 当前证书到期时间Unix毫秒
  int64 last_heartbeat_at = 16; // 最近心跳Unix毫秒
  int64 create_time = 17; // 创建时间Unix毫秒
  int64 update_time = 18; // 更新时间Unix毫秒
}

// 创建V7 Local Agent和一次性注册码请求。
message CreateLocalAgentRegistrationReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  string agent_code = 2; // 租户内稳定编码
  string agent_name = 3; // 展示名称
  string pool_code = 4; // 构建池编码
  HybridArtifactMode artifact_mode = 5; // Artifact模式
  string customer_storage_ref = 6; // 客户存储Secret引用
  repeated int64 allowed_app_ids = 7; // 允许构建的应用ID
  repeated LocalAgentCapability capabilities = 8; // 初始预定义能力
  int64 expires_seconds = 9; // 一次性注册码有效秒数
}

// V7 Local Agent一次性注册码响应，注册码只返回一次。
message LocalAgentRegistrationResp {
  common.RespBase base = 1; // 通用响应
  LocalAgent data = 2; // 已创建Agent
  string registration_token = 3; // 一次性注册码明文
  int64 expires_at = 4; // 注册码过期时间Unix毫秒
}

// Agent首次出站注册请求，CSR私钥仅存在Agent本地。
message RegisterLocalAgentReq {
  string registration_token = 1; // 一次性注册码
  string csr_pem = 2; // PKCS#10 CSR PEM
  string agent_version = 3; // Agent语义化版本
  int32 protocol_version = 4; // Agent协议版本
  string nonce = 5; // 单次随机Nonce
  int64 timestamp = 6; // 请求时间Unix毫秒
  string source_ip = 7; // API边界解析的来源IP
}

// Agent首次注册或证书轮换响应，私钥不经过控制面。
message RegisterLocalAgentResp {
  common.RespBase base = 1; // 通用响应
  LocalAgent data = 2; // Agent信息
  LocalAgentCertificate certificate = 3; // 新签发公开证书
  string ca_certificate_pem = 4; // Agent mTLS CA公开证书
}

// V7 Agent管理查询请求。
message LocalAgentIdReq {
  int64 id = 1; // Agent ID
  int64 tenant_id = 2; // 目标租户ID，0表示当前租户
}

// V7 Agent详情响应。
message LocalAgentResp {
  common.RespBase base = 1; // 通用响应
  LocalAgent data = 2; // Agent信息
}

// V7 Agent分页查询请求。
message LocalAgentListReq {
  int64 tenant_id = 1; // 目标租户ID，0表示当前租户
  LocalAgentStatus status = 2; // 状态筛选，未知表示全部
  int32 page = 3; // 页码，从1开始
  int32 page_size = 4; // 每页数量
}

// V7 Agent分页响应。
message LocalAgentListResp {
  common.RespBase base = 1; // 通用响应
  repeated LocalAgent data = 2; // Agent列表
  int64 total = 3; // 总数
}

// V7 mTLS Agent请求认证上下文，由网关根据客户端证书填充。
message LocalAgentAuth {
  int64 agent_id = 1; // Agent ID
  string certificate_serial = 2; // mTLS客户端证书序列号
  string certificate_fingerprint_sha256 = 3; // mTLS客户端证书指纹
  string nonce = 4; // 单次随机Nonce
  int64 timestamp = 5; // 请求时间Unix毫秒
}

// V7 Agent心跳请求。
message HeartbeatLocalAgentReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  string agent_version = 2; // Agent语义化版本
  int32 protocol_version = 3; // Agent协议版本
  repeated LocalAgentCapability capabilities = 4; // 当前能力快照
  repeated int64 running_task_ids = 5; // 当前执行任务ID
}

// V7 Agent Drain管理请求。
message DrainLocalAgentReq {
  int64 id = 1; // Agent ID
  int64 tenant_id = 2; // 目标租户ID，0表示当前租户
  LocalAgentDrainStatus drain_status = 3; // 目标排空状态
}

// V7 Agent吊销请求。
message RevokeLocalAgentReq {
  int64 id = 1; // Agent ID
  int64 tenant_id = 2; // 目标租户ID，0表示当前租户
  string reason = 3; // 吊销原因
}

// V7 Agent证书轮换请求。
message RotateLocalAgentCertificateReq {
  LocalAgentAuth auth = 1; // 当前有效mTLS认证上下文
  string csr_pem = 2; // 使用新本地私钥生成的CSR PEM
}

// V7 Agent领取构建任务请求。
message ClaimLocalAgentBuildTaskReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  int32 lease_seconds = 2; // 租约秒数
}

// V7 Agent任务响应，无任务时task为空。
message LocalAgentBuildTaskResp {
  common.RespBase base = 1; // 通用响应
  BuildTask task = 2; // 已领取且经过租户、应用、能力检查的任务
  HybridArtifactMode artifact_mode = 3; // 本任务Artifact模式
}

// V7 Agent任务续租请求。
message RenewLocalAgentTaskLeaseReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  int64 task_id = 2; // 构建任务ID
  int32 builder_attempt = 3; // fencing尝试次数
  int32 lease_seconds = 4; // 续租秒数
}

// V7 Agent构建进度请求。
message ReportLocalAgentBuildProgressReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  int64 task_id = 2; // 构建任务ID
  int32 builder_attempt = 3; // fencing尝试次数
  BuildTaskStatus status = 4; // 预定义构建阶段
  int32 progress = 5; // 进度百分比
  string message = 6; // 脱敏进度摘要
}

// V7 Agent构建成功请求。
message CompleteLocalAgentBuildTaskReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  int64 task_id = 2; // 构建任务ID
  int32 builder_attempt = 3; // fencing尝试次数
  string apk_reference = 4; // 对象引用，不包含凭证
  string apk_sha256 = 5; // APK SHA-256
  int64 apk_size = 6; // APK大小字节数
  string log_reference = 7; // 日志对象引用，不包含凭证
  string log_sha256 = 8; // 日志SHA-256
  int64 log_size = 9; // 日志大小字节数
}

// V7 Agent构建失败请求。
message FailLocalAgentBuildTaskReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  int64 task_id = 2; // 构建任务ID
  int32 builder_attempt = 3; // fencing尝试次数
  string error_message = 4; // 脱敏失败摘要
  string log_reference = 5; // 日志对象引用，不包含凭证
  string log_sha256 = 6; // 日志SHA-256
  int64 log_size = 7; // 日志大小字节数
}

// V7 Hybrid Artifact完整性登记请求。
message VerifyHybridArtifactReq {
  LocalAgentAuth auth = 1; // mTLS认证上下文
  int64 task_id = 2; // 构建任务ID
  int32 builder_attempt = 3; // fencing尝试次数
  HybridArtifactType artifact_type = 4; // Artifact类型
  HybridArtifactMode storage_mode = 5; // 存储模式
  string object_reference = 6; // 对象引用或离线包ID
  string sha256 = 7; // 内容SHA-256
  int64 size_bytes = 8; // 内容大小字节数
}

service Core {
  rpc CreateApplication(CreateApplicationReq) returns (ApplicationResp);
  rpc GetApplication(ApplicationIdReq) returns (ApplicationResp);
  rpc ListApplications(ApplicationListReq) returns (ApplicationListResp);

  // 创建待上传的私有存储对象元数据。
  rpc CreateStorageObject(CreateStorageObjectReq) returns (StorageObjectResp);
  // 查询当前租户的私有存储对象。
  rpc GetStorageObject(StorageObjectIdReq) returns (StorageObjectResp);
  // 完成上传校验并把对象置为可用。
  rpc CompleteStorageObject(CompleteStorageObjectReq) returns (StorageObjectResp);
  // 标记上传或校验失败。
  rpc FailStorageObject(FailStorageObjectReq) returns (RespBase);
  // 领取超时未完成或失败的上传对象，供后台清理物理文件。
  rpc ClaimExpiredStorageObjects(ClaimExpiredStorageObjectsReq) returns (ClaimExpiredStorageObjectsResp);
  // 确认物理对象已删除并把元数据置为已删除。
  rpc MarkStorageObjectDeleted(MarkStorageObjectDeletedReq) returns (RespBase);

  rpc CreateVersion(CreateVersionReq) returns (VersionResp);
  rpc GetVersion(VersionIdReq) returns (VersionResp);
  rpc ListVersions(VersionListReq) returns (VersionListResp);

  rpc CreateChannel(CreateChannelReq) returns (ChannelResp);
  rpc GetChannel(ChannelIdReq) returns (ChannelResp);
  rpc ListChannels(ChannelListReq) returns (ChannelListResp);

  rpc CreateSigningConfig(CreateSigningConfigReq) returns (SigningConfigResp);
  rpc GetSigningConfig(SigningConfigIdReq) returns (SigningConfigResp);
  rpc ListSigningConfigs(SigningConfigListReq) returns (SigningConfigListResp);

  // 创建应用品牌配置。
  rpc CreateBrandingProfile(CreateBrandingProfileReq) returns (BrandingProfileResp);
  // 更新应用品牌配置并递增修订号。
  rpc UpdateBrandingProfile(UpdateBrandingProfileReq) returns (BrandingProfileResp);
  // 查询当前租户的品牌配置。
  rpc GetBrandingProfile(BrandingProfileIdReq) returns (BrandingProfileResp);
  // 分页查询当前租户的品牌配置。
  rpc ListBrandingProfiles(BrandingProfileListReq) returns (BrandingProfileListResp);
  // 修改品牌配置状态。
  rpc ChangeBrandingProfileStatus(ChangeBrandingProfileStatusReq) returns (BrandingProfileResp);
  // 创建或重置品牌兼容性预检记录。
  rpc CreateBrandingPreflight(CreateBrandingPreflightReq) returns (BrandingPreflightResp);
  // 查询品牌兼容性预检记录。
  rpc GetBrandingPreflight(BrandingPreflightIdReq) returns (BrandingPreflightResp);
  // 分页查询品牌兼容性预检记录。
  rpc ListBrandingPreflights(BrandingPreflightListReq) returns (BrandingPreflightListResp);
  // 原子领取一个待处理或租约过期的品牌兼容性预检。
  rpc ClaimBrandingPreflight(ClaimBrandingPreflightReq) returns (BrandingPreflightExecutionContextResp);
  // 完成品牌兼容性预检。
  rpc CompleteBrandingPreflight(CompleteBrandingPreflightReq) returns (BrandingPreflightResp);

  // 创建V3白标模板。
  rpc CreateWhiteLabelTemplate(CreateWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
  // 更新尚未发布的V3白标模板。
  rpc UpdateWhiteLabelTemplate(UpdateWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
  // 复制V3白标模板及其修订为新草稿。
  rpc CopyWhiteLabelTemplate(CopyWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
  // 删除从未发布且未被产品引用的V3白标模板。
  rpc DeleteWhiteLabelTemplate(WhiteLabelTemplateIdReq) returns (RespBase);
  // 查询V3白标模板。
  rpc GetWhiteLabelTemplate(WhiteLabelTemplateIdReq) returns (WhiteLabelTemplateResp);
  // 分页查询V3白标模板。
  rpc ListWhiteLabelTemplates(WhiteLabelTemplateListReq) returns (WhiteLabelTemplateListResp);
  // 创建不可变模板修订。
  rpc CreateWhiteLabelTemplateRevision(CreateWhiteLabelTemplateRevisionReq) returns (WhiteLabelTemplateRevisionResp);
  // 查询单个模板修订。
  rpc GetWhiteLabelTemplateRevision(WhiteLabelTemplateRevisionIdReq) returns (WhiteLabelTemplateRevisionResp);
  // 更新尚未发布的模板草稿修订。
  rpc UpdateWhiteLabelTemplateRevision(UpdateWhiteLabelTemplateRevisionReq) returns (WhiteLabelTemplateRevisionResp);
  // 删除尚未发布的模板草稿修订。
  rpc DeleteWhiteLabelTemplateRevision(WhiteLabelTemplateRevisionIdReq) returns (RespBase);
  // 查询模板修订。
  rpc ListWhiteLabelTemplateRevisions(WhiteLabelTemplateRevisionListReq) returns (WhiteLabelTemplateRevisionListResp);
  // 发布模板修订。
  rpc PublishWhiteLabelTemplate(PublishWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
	// 修改V3白标模板状态。
	rpc ChangeWhiteLabelTemplateStatus(ChangeWhiteLabelTemplateStatusReq) returns (WhiteLabelTemplateResp);
  // 创建V3白标产品。
  rpc CreateWhiteLabelProduct(CreateWhiteLabelProductReq) returns (WhiteLabelProductResp);
  // 更新V3白标产品。
  rpc UpdateWhiteLabelProduct(UpdateWhiteLabelProductReq) returns (WhiteLabelProductResp);
  // 删除未启用且没有历史构建的V3白标产品。
  rpc DeleteWhiteLabelProduct(WhiteLabelProductIdReq) returns (RespBase);
  // 查询V3白标产品。
  rpc GetWhiteLabelProduct(WhiteLabelProductIdReq) returns (WhiteLabelProductResp);
  // 分页查询V3白标产品。
  rpc ListWhiteLabelProducts(WhiteLabelProductListReq) returns (WhiteLabelProductListResp);
  // 修改V3白标产品状态。
  rpc ChangeWhiteLabelProductStatus(ChangeWhiteLabelProductStatusReq) returns (WhiteLabelProductResp);
  // 同步预检V3白标产品契约和依赖。
  rpc PreflightWhiteLabelProduct(WhiteLabelProductIdReq) returns (WhiteLabelProductPreflightResp);

  rpc CreateBuildTask(CreateBuildTaskReq) returns (BuildTaskResp);
  rpc GetBuildTask(BuildTaskIdReq) returns (BuildTaskResp);
  rpc ListBuildTasks(BuildTaskListReq) returns (BuildTaskListResp);
  // 取消待处理或执行中的V4构建任务并立即推进fencing代次。
  rpc CancelBuildTask(CancelBuildTaskReq) returns (BuildTaskResp);
  // 根据不可变历史快照创建V4重试任务。
  rpc RetryBuildTask(RetryBuildTaskReq) returns (BuildTaskResp);

  // 查询V4 Builder节点详情。
  rpc GetBuilderNode(BuilderNodeIdReq) returns (BuilderNodeResp);
  // 分页查询V4 Builder集群节点。
  rpc ListBuilderNodes(BuilderNodeListReq) returns (BuilderNodeListResp);
  // 修改V4 Builder节点排空状态。
  rpc DrainBuilderNode(DrainBuilderNodeReq) returns (BuilderNodeResp);
  // 在心跳、失败次数和磁盘容量均恢复后人工解除V4 Builder节点隔离。
  rpc RecoverBuilderNode(RecoverBuilderNodeReq) returns (BuilderNodeResp);
  // 创建或更新V4构建并发与公平调度策略。
  rpc UpsertBuildConcurrencyPolicy(UpsertBuildConcurrencyPolicyReq) returns (BuildConcurrencyPolicyResp);
  // 分页查询V4构建并发与公平调度策略。
  rpc ListBuildConcurrencyPolicies(BuildConcurrencyPolicyListReq) returns (BuildConcurrencyPolicyListResp);
  // 分页查询V4构建缓存条目。
  rpc ListBuildCacheEntries(BuildCacheEntryListReq) returns (BuildCacheEntryListResp);
  // 管理端失效V4构建缓存条目。
  rpc InvalidateBuildCache(InvalidateBuildCacheReq) returns (BuildCacheEntryResp);
  // 分页查询V4结构化调度事件。
  rpc ListBuildSchedulerEvents(BuildSchedulerEventListReq) returns (BuildSchedulerEventListResp);
  // 查询V4构建集群运行指标与告警摘要。
  rpc GetBuildClusterMetrics(BuildClusterMetricsReq) returns (BuildClusterMetricsResp);

  // 创建V5 Open API凭证并一次性返回Secret。
  rpc CreateOpenApiCredential(CreateOpenApiCredentialReq) returns (OpenApiCredentialSecretResp);
  // 分页查询V5 Open API凭证。
  rpc ListOpenApiCredentials(OpenApiCredentialListReq) returns (OpenApiCredentialListResp);
  // 轮换V5 Open API凭证并一次性返回新Secret。
  rpc RotateOpenApiCredential(RotateOpenApiCredentialReq) returns (OpenApiCredentialSecretResp);
  // 立即吊销V5 Open API凭证。
  rpc RevokeOpenApiCredential(OpenApiCredentialIdReq) returns (OpenApiCredentialResp);
  // 验证V5 Open API凭证、IP、状态和有效期。
  rpc AuthenticateOpenApiCredential(AuthenticateOpenApiCredentialReq) returns (OpenApiAuthContextResp);
  // 申请或读取Open API幂等执行记录。
  rpc BeginOpenApiIdempotency(BeginOpenApiIdempotencyReq) returns (OpenApiIdempotencyResp);
  // 保存Open API幂等请求的最终响应。
  rpc CompleteOpenApiIdempotency(CompleteOpenApiIdempotencyReq) returns (RespBase);
  // 写入Open API调用审计。
  rpc RecordOpenApiAudit(RecordOpenApiAuditReq) returns (RespBase);
  // 创建Webhook订阅端点并一次性返回签名Secret。
  rpc CreateWebhookEndpoint(CreateWebhookEndpointReq) returns (WebhookEndpointSecretResp);
  // 更新Webhook订阅端点。
  rpc UpdateWebhookEndpoint(UpdateWebhookEndpointReq) returns (WebhookEndpointResp);
  // 查询Webhook订阅端点。
  rpc GetWebhookEndpoint(WebhookEndpointIdReq) returns (WebhookEndpointResp);
  // 查询Webhook订阅端点列表。
  rpc ListWebhookEndpoints(WebhookEndpointListReq) returns (WebhookEndpointListResp);
  // 重置Webhook签名Secret并一次性返回新Secret。
  rpc RotateWebhookEndpointSecret(WebhookEndpointIdReq) returns (WebhookEndpointSecretResp);
  // 查询Webhook投递日志。
  rpc ListWebhookDeliveries(WebhookDeliveryListReq) returns (WebhookDeliveryListResp);
  // 重放失败或死信的Webhook投递。
  rpc ReplayWebhookDelivery(WebhookDeliveryIdReq) returns (WebhookDeliveryResp);
  // 创建只投递到指定端点的测试事件。
  rpc CreateTestWebhookEvent(CreateTestWebhookEventReq) returns (RespBase);
  // 完成受信任的GitHub/GitLab OAuth回调或App安装同步，并加密保存令牌。
  rpc CompleteSourceIntegration(CompleteSourceIntegrationReq) returns (SourceIntegrationResp);
  // 查询代码平台集成。
  rpc GetSourceIntegration(SourceIntegrationIdReq) returns (SourceIntegrationResp);
  // 分页查询代码平台集成。
  rpc ListSourceIntegrations(SourceIntegrationListReq) returns (SourceIntegrationListResp);
  // 读取有效集成令牌，仅供受内部认证保护的供应商客户端调用，禁止暴露到HTTP。
  rpc GetSourceIntegrationCredential(SourceIntegrationIdReq) returns (SourceIntegrationCredentialResp);
  // 断开集成并使令牌立即不可用。
  rpc DisconnectSourceIntegration(SourceIntegrationIdReq) returns (SourceIntegrationResp);
  // 同步OAuth/App明确授权的只读仓库。
  rpc AuthorizeSourceRepository(AuthorizeSourceRepositoryReq) returns (SourceRepositoryResp);
  // 查询单个授权仓库。
  rpc GetSourceRepository(SourceRepositoryIdReq) returns (SourceRepositoryResp);
  // 分页查询授权仓库。
  rpc ListSourceRepositories(SourceRepositoryListReq) returns (SourceRepositoryListResp);
  // 撤销仓库授权。
  rpc RevokeSourceRepository(SourceRepositoryIdReq) returns (SourceRepositoryResp);
  // 记录从授权仓库导入并完成校验的APK Artifact来源。
  rpc RecordSourceArtifact(RecordSourceArtifactReq) returns (SourceArtifactResp);
  // 在同一数据库事务中创建版本、绑定存储对象并记录供应商Artifact来源。
  rpc ImportSourceArtifact(ImportSourceArtifactReq) returns (SourceArtifactImportResp);
  // 创建预定义源码平台构建触发策略并一次性返回回调令牌和签名Secret。
  rpc CreateSourceBuildTrigger(CreateSourceBuildTriggerReq) returns (SourceBuildTriggerSecretResp);
  // 更新预定义源码平台构建触发策略，不能修改授权仓库和应用。
  rpc UpdateSourceBuildTrigger(UpdateSourceBuildTriggerReq) returns (SourceBuildTriggerResp);
  // 查询预定义源码平台构建触发策略。
  rpc GetSourceBuildTrigger(SourceBuildTriggerIdReq) returns (SourceBuildTriggerResp);
  // 分页查询预定义源码平台构建触发策略。
  rpc ListSourceBuildTriggers(SourceBuildTriggerListReq) returns (SourceBuildTriggerListResp);
  // 轮换回调随机令牌和供应商签名Secret并一次性返回。
  rpc RotateSourceBuildTriggerSecret(SourceBuildTriggerIdReq) returns (SourceBuildTriggerSecretResp);
  // 解析回调随机令牌和内部签名材料，仅供受内部认证保护的公开入口调用。
  rpc ResolveSourceBuildTrigger(ResolveSourceBuildTriggerReq) returns (SourceBuildTriggerCredentialResp);
  // 将已完成供应商签名验证的标准化事件可靠且幂等地写入队列。
  rpc EnqueueSourceWebhookEvent(EnqueueSourceWebhookEventReq) returns (EnqueueSourceWebhookEventResp);
  // Worker使用租约原子领取待处理或超时事件。
  rpc ClaimSourceWebhookEvent(ClaimSourceWebhookEventReq) returns (ClaimSourceWebhookEventResp);
  // Worker记录Artifact导入和构建任务创建成功。
  rpc CompleteSourceWebhookEvent(CompleteSourceWebhookEventReq) returns (RespBase);
  // Worker按可重试性记录失败、指数退避或最终失败。
  rpc FailSourceWebhookEvent(FailSourceWebhookEventReq) returns (RespBase);
  // 分页查询源码平台入站事件审计记录。
  rpc ListSourceWebhookEvents(SourceWebhookEventListReq) returns (SourceWebhookEventListResp);

  // 创建V6不可变套餐版本，同编码自动分配下一版本号。
  rpc CreateBillingPlan(CreateBillingPlanReq) returns (BillingPlanResp);
  // 查询V6套餐版本。
  rpc GetBillingPlan(BillingPlanIdReq) returns (BillingPlanResp);
  // 查询V6套餐版本列表。
  rpc ListBillingPlans(BillingPlanListReq) returns (BillingPlanListResp);
  // 退役V6套餐版本，不影响历史订阅。
  rpc RetireBillingPlan(BillingPlanIdReq) returns (BillingPlanResp);
  // 查询租户当前订阅、权益和固化套餐版本。
  rpc GetTenantBilling(TenantBillingReq) returns (TenantBillingResp);
  // 创建或更新人工合同订阅并原子刷新权益。
  rpc UpsertManualSubscription(UpsertManualSubscriptionReq) returns (TenantBillingResp);
  // 立即或周期末变更套餐。
  rpc ChangeTenantSubscription(ChangeTenantSubscriptionReq) returns (TenantBillingResp);
  // 立即或周期末取消订阅。
  rpc CancelTenantSubscription(CancelTenantSubscriptionReq) returns (TenantBillingResp);
  // 并发安全地预占构建、存储或席位额度。
  rpc ReserveQuota(ReserveQuotaReq) returns (QuotaReservationResp);
  // 幂等确认额度预占并写不可变用量账本。
  rpc ConfirmQuota(QuotaReservationActionReq) returns (QuotaReservationResp);
  // 幂等释放未使用额度预占。
  rpc ReleaseQuota(QuotaReservationActionReq) returns (QuotaReservationResp);
  // 追加一条幂等不可变用量记录。
  rpc RecordUsage(RecordUsageReq) returns (RespBase);
  // 查询周期用量、预占和当前限额。
  rpc GetBillingUsage(BillingUsageReq) returns (BillingUsageResp);
  // 查询租户不可变账单及账单项。
  rpc ListInvoices(InvoiceListReq) returns (InvoiceListResp);
  // 应用已验签支付事件，事件幂等且拒绝乱序覆盖新状态。
  rpc ApplyBillingWebhook(ApplyBillingWebhookReq) returns (RespBase);

  // 创建V7 Local Agent并一次性返回注册码。
  rpc CreateLocalAgentRegistration(CreateLocalAgentRegistrationReq) returns (LocalAgentRegistrationResp);
  // Agent使用一次性注册码和本地CSR完成首次注册。
  rpc RegisterLocalAgent(RegisterLocalAgentReq) returns (RegisterLocalAgentResp);
  // 查询V7 Local Agent详情。
  rpc GetLocalAgent(LocalAgentIdReq) returns (LocalAgentResp);
  // 分页查询V7 Local Agent。
  rpc ListLocalAgents(LocalAgentListReq) returns (LocalAgentListResp);
  // Agent通过mTLS出站连接上报心跳和预定义能力。
  rpc HeartbeatLocalAgent(HeartbeatLocalAgentReq) returns (LocalAgentResp);
  // 管理员远程设置Agent Drain状态。
  rpc DrainLocalAgent(DrainLocalAgentReq) returns (LocalAgentResp);
  // 管理员吊销Agent及其全部有效证书。
  rpc RevokeLocalAgent(RevokeLocalAgentReq) returns (LocalAgentResp);
  // Agent使用当前有效证书和新CSR轮换客户端证书。
  rpc RotateLocalAgentCertificate(RotateLocalAgentCertificateReq) returns (RegisterLocalAgentResp);
  // Agent领取经过租户、应用、能力和协议范围校验的构建任务。
  rpc ClaimLocalAgentBuildTask(ClaimLocalAgentBuildTaskReq) returns (LocalAgentBuildTaskResp);
  // Agent按任务attempt续租，旧进程不能回写。
  rpc RenewLocalAgentTaskLease(RenewLocalAgentTaskLeaseReq) returns (RespBase);
  // Agent回报预定义构建阶段，不支持任意命令。
  rpc ReportLocalAgentBuildProgress(ReportLocalAgentBuildProgressReq) returns (RespBase);
  // Agent校验Artifact后完成构建任务。
  rpc CompleteLocalAgentBuildTask(CompleteLocalAgentBuildTaskReq) returns (RespBase);
  // Agent记录脱敏失败摘要并结束任务。
  rpc FailLocalAgentBuildTask(FailLocalAgentBuildTaskReq) returns (RespBase);
  // 校验并登记三种存储模式下的Artifact引用。
  rpc VerifyHybridArtifact(VerifyHybridArtifactReq) returns (RespBase);

  rpc ReportInstall(InstallReportReq) returns (RespBase);
  rpc ReportChannelEvent(ReportChannelEventReq) returns (RespBase);
  rpc GetChannelStats(ChannelStatsReq) returns (ChannelStatsResp);
  // 解析渠道最新成功产物并幂等记录点击、下载事件。
  rpc ResolveChannelDownload(ResolveChannelDownloadReq) returns (ChannelDownloadArtifactResp);

  rpc ClaimBuildTask(ClaimBuildTaskReq) returns (BuildTaskResp);
  // 注册或刷新V4 Builder节点能力。
  rpc RegisterBuilderNode(RegisterBuilderNodeReq) returns (BuilderNodeResp);
  // 上报V4 Builder节点心跳、容量和运行任务。
  rpc BuilderNodeHeartbeat(BuilderNodeHeartbeatReq) returns (BuilderNodeResp);
  // 结合节点能力、公平队列和并发槽位原子领取V4构建任务。
  rpc ClaimScheduledBuildTask(ClaimScheduledBuildTaskReq) returns (BuildTaskResp);
  // 解析并记录V4输入可寻址构建缓存命中。
  rpc ResolveBuildCache(ResolveBuildCacheReq) returns (BuildCacheResolutionResp);
  // 发布独立V4构建缓存产物。
  rpc PublishBuildCache(PublishBuildCacheReq) returns (BuildCacheEntryResp);
  // 执行V4构建缓存TTL/LRU清理并返回可物理删除对象。
  rpc CleanupBuildCache(CleanupBuildCacheReq) returns (CleanupBuildCacheResp);
  // 读取当前Builder已领取任务的内部执行上下文。
  rpc GetBuildExecutionContext(GetBuildExecutionContextReq) returns (BuildExecutionContextResp);
  rpc HeartbeatBuildTask(HeartbeatBuildTaskReq) returns (RespBase);
  rpc ReportBuildProgress(ReportBuildProgressReq) returns (RespBase);
  rpc CompleteBuildTask(CompleteBuildTaskReq) returns (RespBase);
  rpc FailBuildTask(FailBuildTaskReq) returns (RespBase);
}
