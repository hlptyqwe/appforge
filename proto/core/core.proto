message CreateBuildTaskReq {
  int64 app_id = 1;
  int64 version_id = 2;
  int64 channel_id = 3;
  int64 signing_config_id = 4;
  int32 priority = 5;
  int64 branding_profile_id = 6; // 可选品牌配置ID，0表示沿用V1构建
  int64 white_label_product_id = 7; // 可选V3白标产品ID，提供后由产品覆盖品牌和签名配置
  string pool_code = 8; // V4目标构建池编码，空值使用default
  int64 source_webhook_event_id = 9; // V5内部源码Webhook事件ID，普通调用必须为0
}

// V4 Builder节点主键请求。
message BuilderNodeIdReq {
  int64 id = 1; // Builder节点ID
}

// V4 注册或刷新Builder节点请求。
message RegisterBuilderNodeReq {
  string node_code = 1; // 节点唯一编码
  string pool_code = 2; // 所属构建池编码
  string endpoint = 3; // 节点管理端点或实例标识
  int32 max_concurrency = 4; // 节点最大并发执行数
  int32 cpu_capacity = 5; // CPU容量，单位毫核
  int64 memory_capacity = 6; // 内存容量，单位字节
  int64 disk_capacity = 7; // 构建磁盘总容量，单位字节
  int64 disk_free = 8; // 构建磁盘剩余容量，单位字节
  string toolchain_version = 9; // APK构建工具链版本
  int32 build_protocol_version = 10; // 构建协议版本
  string capability_json = 11; // 节点能力白名单JSON
}

// V4 Builder节点心跳请求。
message BuilderNodeHeartbeatReq {
  string node_code = 1; // 节点唯一编码
  int32 running_count = 2; // 当前执行任务数
  int64 disk_free = 3; // 构建磁盘剩余容量，单位字节
  repeated int64 running_task_ids = 4; // 当前执行任务ID列表
  string last_error_message = 5; // 最近错误摘要，空值表示本次无错误
}

// V4 修改Builder节点排空状态请求。
message DrainBuilderNodeReq {
  int64 id = 1; // Builder节点ID，管理端调用时使用
  string node_code = 2; // Builder节点编码，内部协议调用时使用
  BuilderDrainStatus drain_status = 3; // 目标排空状态
}

// V4 人工确认恢复已隔离Builder节点请求。
message RecoverBuilderNodeReq {
  int64 id = 1; // Builder节点ID
  string reason = 2; // 人工恢复原因，写入结构化调度事件
}

// V4 原子领取调度任务请求。
message ClaimScheduledBuildTaskReq {
  string node_code = 1; // 已注册Builder节点编码
  int32 lease_seconds = 2; // 任务和槽位租约秒数
}

// V4 取消构建任务请求。
message CancelBuildTaskReq {
  int64 id = 1; // 构建任务ID
  string reason = 2; // 取消原因
}

// V4 重试构建任务请求。
message RetryBuildTaskReq {
  int64 id = 1; // 来源构建任务ID
  int32 priority = 2; // 新任务优先级，0表示沿用
}

// V4 创建或更新构建并发策略请求。
message UpsertBuildConcurrencyPolicyReq {
  int64 id = 1; // 策略ID，0表示按作用域创建
  int64 tenant_id = 2; // 租户ID，0表示全局作用域
  int64 app_id = 3; // 应用ID，0表示非应用作用域
  string pool_code = 4; // 构建池编码
  int32 max_concurrency = 5; // 作用域最大并发数
  int32 fair_weight = 6; // 租户公平调度权重
  int32 max_priority = 7; // 允许提交的最高普通优先级
  BuildPolicyStatus status = 8; // 策略状态
}

// V4 构建缓存主键请求。
message BuildCacheEntryIdReq {
  int64 id = 1; // 构建缓存条目ID
}

// V4 解析构建缓存请求。
message ResolveBuildCacheReq {
  int64 task_id = 1; // 当前构建任务ID
  string node_code = 2; // 当前Builder节点编码
  int32 builder_attempt = 3; // 当前任务领取代次
  string toolchain_version = 4; // 当前节点工具链版本
  int32 build_protocol_version = 5; // 当前节点构建协议版本
  bool confirm_hit = 6; // Worker完成对象字节校验后确认命中；false仅解析候选缓存
}

// V4 构建缓存解析结果。
message BuildCacheResolution {
  bool hit = 1; // 是否命中有效缓存
  BuildCacheEntry entry = 2; // 命中的缓存条目
  StorageObject artifact = 3; // 待校验缓存产物对象
}

// V4 构建缓存解析响应。
message BuildCacheResolutionResp {
  common.RespBase base = 1; // 通用响应
  BuildCacheResolution data = 2; // 缓存解析结果
}

// V4 发布构建缓存请求。
message PublishBuildCacheReq {
  int64 task_id = 1; // 已成功构建任务ID
  string node_code = 2; // 发布缓存的Builder节点编码
  int32 builder_attempt = 3; // 构建任务领取代次
  string toolchain_version = 4; // 构建工具链版本
  int32 build_protocol_version = 5; // 构建协议版本
  int64 artifact_object_id = 6; // 独立缓存产物对象ID
  string artifact_sha256 = 7; // 缓存产物SHA-256
  int64 size_bytes = 8; // 缓存产物大小，单位字节
  int64 ttl_seconds = 9; // 缓存TTL秒数
  string artifact_object_key = 10; // 缓存中间APK私有对象Key，artifact_object_id为0时由Core登记
}

// V4 失效构建缓存请求。
message InvalidateBuildCacheReq {
  int64 id = 1; // 构建缓存条目ID
  int64 task_id = 2; // 发现损坏的构建任务ID，管理端操作允许为0
  string node_code = 3; // 发现损坏的Builder节点编码
  string reason = 4; // 失效原因
}

// V4 清理构建缓存请求。
message CleanupBuildCacheReq {
  int32 limit = 1; // 单次最多清理条目数
  int64 target_free_bytes = 2; // 目标释放字节数，0表示仅TTL清理
}

// V4 构建缓存清理结果。
message CleanupBuildCacheResult {
  int32 invalidated_count = 1; // 失效条目数
  int64 reclaimable_bytes = 2; // 可回收对象字节数
  repeated int64 object_ids = 3; // 可物理删除且未被任务引用的对象ID
}

// V4 构建缓存清理响应。
message CleanupBuildCacheResp {
  common.RespBase base = 1; // 通用响应
  CleanupBuildCacheResult data = 2; // 清理结果
}

