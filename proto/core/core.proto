syntax = "proto3";

package core;

import "proto/common/common.proto";

option go_package = "appforge/proto/core;core";

message RespBase {
  common.RespBase base = 1;
}

// 应用状态。
enum ApplicationStatus {
  APPLICATION_STATUS_UNKNOWN = 0; // 未知
  APPLICATION_STATUS_ENABLED = 1; // 启用
  APPLICATION_STATUS_DISABLED = 2; // 停用
}

// 应用版本状态。
enum VersionStatus {
  VERSION_STATUS_UNKNOWN = 0; // 未知
  VERSION_STATUS_DRAFT = 1; // 草稿
  VERSION_STATUS_PUBLISHED = 2; // 已发布
  VERSION_STATUS_DISABLED = 3; // 已停用
}

// 推广渠道状态。
enum ChannelStatus {
  CHANNEL_STATUS_UNKNOWN = 0; // 未知
  CHANNEL_STATUS_ENABLED = 1; // 启用
  CHANNEL_STATUS_DISABLED = 2; // 停用
}

// APK 构建任务状态。
enum BuildTaskStatus {
  BUILD_TASK_STATUS_UNKNOWN = 0; // 未知
  BUILD_TASK_STATUS_PENDING = 1; // 待处理
  BUILD_TASK_STATUS_BUILDING = 2; // 构建中
  BUILD_TASK_STATUS_SIGNING = 3; // 签名中
  BUILD_TASK_STATUS_UPLOADING = 4; // 上传中
  BUILD_TASK_STATUS_SUCCESS = 5; // 成功
  BUILD_TASK_STATUS_FAILED = 6; // 失败
}

// 私有对象存储中的业务对象类型。
enum StorageObjectType {
  STORAGE_OBJECT_TYPE_UNKNOWN = 0; // 未知类型
  STORAGE_OBJECT_TYPE_SOURCE_APK = 1; // 客户上传的原始APK
  STORAGE_OBJECT_TYPE_KEYSTORE = 2; // APK签名文件
  STORAGE_OBJECT_TYPE_BUILT_APK = 3; // Builder生成的渠道APK
  STORAGE_OBJECT_TYPE_BUILD_LOG = 4; // Builder构建日志
  STORAGE_OBJECT_TYPE_BRAND_LOGO = 5; // 品牌Logo图片
  STORAGE_OBJECT_TYPE_BRAND_SPLASH = 6; // 品牌启动图图片
  STORAGE_OBJECT_TYPE_TEMPLATE_FILE = 7; // V3模板声明式补丁引用的受控文件
}

// 存储对象生命周期状态。
enum StorageObjectStatus {
  STORAGE_OBJECT_STATUS_UNKNOWN = 0; // 未知状态
  STORAGE_OBJECT_STATUS_UPLOADING = 1; // 等待或正在上传
  STORAGE_OBJECT_STATUS_READY = 2; // 上传校验完成，可被业务绑定
  STORAGE_OBJECT_STATUS_BOUND = 3; // 已绑定到版本、签名配置或构建任务
  STORAGE_OBJECT_STATUS_DELETED = 4; // 已删除
  STORAGE_OBJECT_STATUS_FAILED = 5; // 上传或校验失败
}

// 品牌资源改写模式。
enum BrandingRewriteMode {
  BRANDING_REWRITE_MODE_UNKNOWN = 0; // 未知模式
  BRANDING_REWRITE_MODE_RESOURCE_REBUILD = 1; // 解包并替换Android资源后重建
  BRANDING_REWRITE_MODE_RUNTIME_CONTRACT = 2; // 写入AppForge运行时契约配置
}

// 品牌配置状态。
enum BrandingProfileStatus {
  BRANDING_PROFILE_STATUS_UNKNOWN = 0; // 未知状态
  BRANDING_PROFILE_STATUS_DRAFT = 1; // 草稿
  BRANDING_PROFILE_STATUS_ENABLED = 2; // 启用
  BRANDING_PROFILE_STATUS_DISABLED = 3; // 停用
}

// 品牌兼容性预检状态。
enum BrandingPreflightStatus {
  BRANDING_PREFLIGHT_STATUS_UNKNOWN = 0; // 未知状态
  BRANDING_PREFLIGHT_STATUS_PENDING = 1; // 待处理
  BRANDING_PREFLIGHT_STATUS_COMPATIBLE = 2; // 兼容
  BRANDING_PREFLIGHT_STATUS_INCOMPATIBLE = 3; // 不兼容
  BRANDING_PREFLIGHT_STATUS_FAILED = 4; // 预检执行失败
}

// V3白标模板状态。
enum WhiteLabelTemplateStatus {
  WHITE_LABEL_TEMPLATE_STATUS_UNKNOWN = 0; // 未知状态
  WHITE_LABEL_TEMPLATE_STATUS_DRAFT = 1; // 草稿
  WHITE_LABEL_TEMPLATE_STATUS_PUBLISHED = 2; // 已发布
  WHITE_LABEL_TEMPLATE_STATUS_DISABLED = 3; // 停用
}

// V3白标模板修订状态。
enum WhiteLabelRevisionStatus {
  WHITE_LABEL_REVISION_STATUS_UNKNOWN = 0; // 未知状态
  WHITE_LABEL_REVISION_STATUS_DRAFT = 1; // 草稿
  WHITE_LABEL_REVISION_STATUS_PUBLISHED = 2; // 已发布且不可变
  WHITE_LABEL_REVISION_STATUS_SUPERSEDED = 3; // 已被新修订取代
}

// V3白标产品状态。
enum WhiteLabelProductStatus {
  WHITE_LABEL_PRODUCT_STATUS_UNKNOWN = 0; // 未知状态
  WHITE_LABEL_PRODUCT_STATUS_DRAFT = 1; // 草稿
  WHITE_LABEL_PRODUCT_STATUS_ENABLED = 2; // 启用
  WHITE_LABEL_PRODUCT_STATUS_DISABLED = 3; // 停用
}

message Application {
  int64 id = 1;
  int64 tenant_id = 2;
  string app_code = 3;
  string app_name = 4;
  string package_name = 5;
  string description = 6;
  string icon_url = 7;
  string api_host = 8;
  ApplicationStatus status = 9; // 应用状态
  int64 create_by = 10;
  int64 create_time = 11;
  int64 update_time = 12;
}

message Version {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  int64 version_code = 4;
  string version_name = 5;
  string source_apk_url = 6;
  string source_apk_sha256 = 7;
  string release_notes = 8;
  string build_config_json = 9;
  VersionStatus status = 10; // 版本状态
  int64 published_at = 11;
  int64 create_by = 12;
  int64 create_time = 13;
  int64 update_time = 14;
  int64 source_apk_object_id = 15; // 原始APK存储对象ID
}

message Channel {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  string channel_code = 4;
  string channel_name = 5;
  string landing_url = 6;
  string download_url = 7;
  ChannelStatus status = 8; // 渠道状态
  int64 create_by = 9;
  int64 create_time = 10;
  int64 update_time = 11;
}

// APK签名配置。
// 密码密文只允许写入，不通过查询接口返回。
message SigningConfig {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  string name = 4;
  string keystore_object_key = 5;
  string key_alias = 6;
  string secret_ref = 7;
  int64 status = 8; // 1启用 2停用
  int64 last_verified_at = 9;
  int64 create_by = 10;
  int64 create_time = 11;
  int64 update_time = 12;
  int64 keystore_object_id = 13; // 签名文件存储对象ID
  string certificate_sha256 = 14; // 签名证书SHA-256指纹
}

message BuildTask {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  int64 version_id = 4;
  int64 channel_id = 5;
  int64 signing_config_id = 6;
  string channel_code = 7;
  int64 version_code = 8;
  string version_name = 9;
  BuildTaskStatus status = 10; // 构建任务状态
  string builder_id = 11;
  int32 builder_attempt = 12;
  int32 priority = 13;
  string apk_url = 14;
  string apk_sha256 = 15;
  int64 apk_size = 16;
  string log_url = 17;
  string error_message = 18;
  int64 queued_at = 19;
  int64 start_time = 20;
  int64 finish_time = 21;
  int64 create_by = 22;
  int64 create_time = 23;
  int64 update_time = 24;
  string source_apk_url = 25; // 构建时使用的原始APK地址快照
  string build_config_json = 26; // 构建时使用的构建配置快照
  int64 source_apk_object_id = 27; // 原始APK对象ID快照
  int64 apk_object_id = 28; // 构建产物APK对象ID
  int64 log_object_id = 29; // 构建日志对象ID
  int64 branding_profile_id = 30; // 构建时使用的品牌配置ID
  int32 branding_revision = 31; // 构建时使用的品牌修订号
  string branding_snapshot_json = 32; // 构建时固化的品牌配置快照JSON
  int64 white_label_product_id = 33; // V3白标产品ID
  int32 template_revision = 34; // V3模板修订号
  string template_snapshot_json = 35; // V3模板和产品不可变快照JSON
}

// 私有对象存储元数据。
message StorageObject {
  int64 id = 1; // 存储对象ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 关联应用ID，上传时允许为0
  StorageObjectType object_type = 4; // 对象类型
  string object_key = 5; // 私有对象存储Key
  string original_name = 6; // 用户上传时的原始文件名
  string content_type = 7; // 对象内容类型
  int64 size_bytes = 8; // 对象大小，单位字节
  string sha256 = 9; // 对象SHA-256
  StorageObjectStatus status = 10; // 生命周期状态
  int64 create_by = 11; // 创建人ID
  int64 create_time = 12; // 创建时间，Unix毫秒
  int64 update_time = 13; // 更新时间，Unix毫秒
}

// 应用品牌白标配置。
message BrandingProfile {
  int64 id = 1; // 品牌配置ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  string profile_name = 4; // 品牌配置名称
  string app_name = 5; // 构建后的应用展示名称
  int64 logo_object_id = 6; // 品牌Logo存储对象ID
  int64 splash_object_id = 7; // 品牌启动图存储对象ID
  string api_host = 8; // 构建后的业务API地址
  BrandingRewriteMode rewrite_mode = 9; // 品牌资源改写模式
  string launcher_icon_target = 10; // Launcher图标资源目标
  string splash_resource_target = 11; // 启动图资源目标
  string runtime_config_json = 12; // 运行时契约扩展配置JSON
  BrandingProfileStatus status = 13; // 品牌配置状态
  int32 revision = 14; // 品牌配置修订号
  int64 create_by = 15; // 创建人ID
  int64 create_time = 16; // 创建时间，Unix毫秒
  int64 update_time = 17; // 更新时间，Unix毫秒
}

// 品牌兼容性预检记录。
message BrandingPreflight {
  int64 id = 1; // 预检记录ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  int64 branding_profile_id = 4; // 品牌配置ID
  int32 branding_revision = 5; // 预检时的品牌修订号
  int64 version_id = 6; // 被检查的应用版本ID
  BrandingPreflightStatus status = 7; // 预检状态
  string report_json = 8; // 结构化预检报告JSON
  string source_apk_sha256 = 9; // 源APK SHA-256快照
  string toolchain_version = 10; // 预检工具链版本
  int64 start_time = 11; // 预检开始时间，Unix毫秒
  int64 finish_time = 12; // 预检完成时间，Unix毫秒
  int64 create_by = 13; // 创建人ID
  int64 create_time = 14; // 创建时间，Unix毫秒
  int64 update_time = 15; // 更新时间，Unix毫秒
  string builder_id = 16; // 当前预检Builder节点ID
  int32 builder_attempt = 17; // 预检领取代次
  int64 lease_until = 18; // Builder租约到期时间，Unix毫秒
}

// V3白标模板。
message WhiteLabelTemplate {
  int64 id = 1; // 模板ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  string template_code = 4; // 模板编码
  string template_name = 5; // 模板名称
  int64 source_version_id = 6; // 源应用版本ID
  string parameter_schema_json = 7; // 参数JSON Schema
  string compatibility_rules_json = 8; // 兼容规则JSON
  WhiteLabelTemplateStatus status = 9; // 模板状态
  int32 published_revision = 10; // 当前发布修订号
  int64 create_by = 11; // 创建人ID
  int64 create_time = 12; // 创建时间，Unix毫秒
  int64 update_time = 13; // 更新时间，Unix毫秒
}

// V3白标模板不可变修订。
message WhiteLabelTemplateRevision {
  int64 id = 1; // 修订ID
  int64 tenant_id = 2; // 所属租户ID
  int64 template_id = 3; // 模板ID
  int32 revision = 4; // 修订号
  string package_name_rule_json = 5; // 动态包名规则JSON
  string manifest_patch_json = 6; // Manifest声明式补丁JSON
  string resource_patch_json = 7; // 资源声明式补丁JSON
  string extension_files_json = 8; // 受控扩展文件JSON
  string expected_artifacts_json = 9; // 产物验收规则JSON
  string checksum = 10; // 规范化修订内容SHA-256
  WhiteLabelRevisionStatus status = 11; // 修订状态
  int64 create_by = 12; // 创建人ID
  int64 create_time = 13; // 创建时间，Unix毫秒
}

// V3白标产品。
message WhiteLabelProduct {
  int64 id = 1; // 产品ID
  int64 tenant_id = 2; // 所属租户ID
  int64 app_id = 3; // 应用ID
  string product_code = 4; // 产品编码
  string product_name = 5; // 产品名称
  int64 template_id = 6; // 模板ID
  int32 template_revision = 7; // 模板修订号
  int64 branding_profile_id = 8; // 品牌配置ID
  string package_name = 9; // Android applicationId
  int64 signing_config_id = 10; // 独立签名配置ID
  string parameter_values_json = 11; // 模板参数值JSON
  WhiteLabelProductStatus status = 12; // 产品状态
  int64 create_by = 13; // 创建人ID
  int64 create_time = 14; // 创建时间，Unix毫秒
  int64 update_time = 15; // 更新时间，Unix毫秒
}

message ApplicationIdReq { int64 id = 1; }
message VersionIdReq { int64 id = 1; }
message ChannelIdReq { int64 id = 1; }
message BuildTaskIdReq { int64 id = 1; }
// 品牌配置主键请求。
message BrandingProfileIdReq { int64 id = 1; }
// 品牌预检记录主键请求。
message BrandingPreflightIdReq { int64 id = 1; }
// 白标模板主键请求。
message WhiteLabelTemplateIdReq {
  int64 id = 1; // 白标模板ID
}
// 白标模板修订主键请求。
message WhiteLabelTemplateRevisionIdReq {
  int64 template_id = 1; // 白标模板ID
  int32 revision = 2; // 模板修订号
}
// 白标产品主键请求。
message WhiteLabelProductIdReq {
  int64 id = 1; // 白标产品ID
}

message ApplicationResp {
  common.RespBase base = 1;
  Application data = 2;
}

message VersionResp {
  common.RespBase base = 1;
  Version data = 2;
}

message ChannelResp {
  common.RespBase base = 1;
  Channel data = 2;
}

message SigningConfigResp {
  common.RespBase base = 1;
  SigningConfig data = 2;
}

message SigningConfigListReq {
  common.PageReq page = 1;
  int64 app_id = 2;
  int64 status = 3;
}

message SigningConfigListResp {
  common.RespBase base = 1;
  repeated SigningConfig data = 2;
}

message BuildTaskResp {
  common.RespBase base = 1;
  BuildTask data = 2;
}

// 品牌配置响应。
message BrandingProfileResp {
  common.RespBase base = 1; // 通用响应
  BrandingProfile data = 2; // 品牌配置
}

// 品牌配置列表请求。
message BrandingProfileListReq {
  common.PageReq page = 1; // 分页参数
  int64 app_id = 2; // 应用ID
  string keyword = 3; // 配置名称或应用名称关键字
  BrandingProfileStatus status = 4; // 品牌配置状态
}

// 品牌配置列表响应。
message BrandingProfileListResp {
  common.RespBase base = 1; // 通用响应
  repeated BrandingProfile data = 2; // 品牌配置列表
}

// 品牌预检记录响应。
message BrandingPreflightResp {
  common.RespBase base = 1; // 通用响应
  BrandingPreflight data = 2; // 品牌预检记录
}

// 品牌预检记录列表请求。
message BrandingPreflightListReq {
  common.PageReq page = 1; // 分页参数
  int64 app_id = 2; // 应用ID
  int64 branding_profile_id = 3; // 品牌配置ID
  int64 version_id = 4; // 应用版本ID
  BrandingPreflightStatus status = 5; // 预检状态
}

// 品牌预检记录列表响应。
message BrandingPreflightListResp {
  common.RespBase base = 1; // 通用响应
  repeated BrandingPreflight data = 2; // 品牌预检记录列表
}

// 白标模板响应。
message WhiteLabelTemplateResp {
  common.RespBase base = 1; // 通用响应
  WhiteLabelTemplate data = 2; // 白标模板
}
// 白标模板列表请求。
message WhiteLabelTemplateListReq {
  common.PageReq page = 1; // 分页参数
  int64 app_id = 2; // 应用ID
  string keyword = 3; // 模板编码或名称关键字
  WhiteLabelTemplateStatus status = 4; // 模板状态
}
// 白标模板列表响应。
message WhiteLabelTemplateListResp {
  common.RespBase base = 1; // 通用响应
  repeated WhiteLabelTemplate data = 2; // 白标模板列表
}
// 白标模板修订响应。
message WhiteLabelTemplateRevisionResp {
  common.RespBase base = 1; // 通用响应
  WhiteLabelTemplateRevision data = 2; // 白标模板修订
}
// 白标模板修订列表请求。
message WhiteLabelTemplateRevisionListReq {
  common.PageReq page = 1; // 分页参数
  int64 template_id = 2; // 白标模板ID
  WhiteLabelRevisionStatus status = 3; // 修订状态
}
// 白标模板修订列表响应。
message WhiteLabelTemplateRevisionListResp {
  common.RespBase base = 1; // 通用响应
  repeated WhiteLabelTemplateRevision data = 2; // 白标模板修订列表
}
// 白标产品响应。
message WhiteLabelProductResp {
  common.RespBase base = 1; // 通用响应
  WhiteLabelProduct data = 2; // 白标产品
}
// 白标产品列表请求。
message WhiteLabelProductListReq {
  common.PageReq page = 1; // 分页参数
  int64 app_id = 2; // 应用ID
  string keyword = 3; // 产品编码、名称或包名关键字
  WhiteLabelProductStatus status = 4; // 产品状态
}
// 白标产品列表响应。
message WhiteLabelProductListResp {
  common.RespBase base = 1; // 通用响应
  repeated WhiteLabelProduct data = 2; // 白标产品列表
}
// 白标产品预检响应。
message WhiteLabelProductPreflightResp {
  common.RespBase base = 1; // 通用响应
  bool compatible = 2; // 是否通过同步预检
  string report_json = 3; // 结构化预检报告JSON
}

message ApplicationListReq {
  common.PageReq page = 1;
  string keyword = 2;
  ApplicationStatus status = 3;
}

message ApplicationListResp {
  common.RespBase base = 1;
  repeated Application data = 2;
}

message VersionListReq {
  common.PageReq page = 1;
  int64 app_id = 2;
  VersionStatus status = 3;
}

message VersionListResp {
  common.RespBase base = 1;
  repeated Version data = 2;
}

message ChannelListReq {
  common.PageReq page = 1;
  int64 app_id = 2;
  string keyword = 3;
  ChannelStatus status = 4;
}

message ChannelListResp {
  common.RespBase base = 1;
  repeated Channel data = 2;
}

message BuildTaskListReq {
  common.PageReq page = 1;
  int64 app_id = 2;
  int64 channel_id = 3;
  BuildTaskStatus status = 4;
}

message BuildTaskListResp {
  common.RespBase base = 1;
  repeated BuildTask data = 2;
}

message CreateApplicationReq {
  string app_code = 1;
  string app_name = 2;
  string package_name = 3;
  string description = 4;
  string icon_url = 5;
  string api_host = 6;
}

message CreateVersionReq {
  int64 app_id = 1;
  int64 version_code = 2;
  string version_name = 3;
  string source_apk_url = 4;
  string source_apk_sha256 = 5;
  string release_notes = 6;
  string build_config_json = 7;
  int64 source_apk_object_id = 8; // 已校验的原始APK对象ID
}

message CreateChannelReq {
  int64 app_id = 1;
  string channel_code = 2;
  string channel_name = 3;
  string landing_url = 4;
  string download_url = 5;
}

message SigningConfigIdReq { int64 id = 1; }

message CreateSigningConfigReq {
  int64 app_id = 1;
  string name = 2;
  string keystore_object_key = 3;
  string key_alias = 4;
  string keystore_password_ciphertext = 5;
  string key_password_ciphertext = 6;
  string secret_ref = 7;
  int64 keystore_object_id = 8; // 已校验的签名文件对象ID
  string certificate_sha256 = 9; // Builder校验得到的签名证书SHA-256指纹
}

// 创建待上传对象元数据请求。
message CreateStorageObjectReq {
  int64 app_id = 1; // 关联应用ID，允许为0
  StorageObjectType object_type = 2; // 对象类型
  string object_key = 3; // 服务端生成的对象Key
  string original_name = 4; // 原始文件名
  string content_type = 5; // 内容类型
  int64 size_bytes = 6; // 客户端声明的对象大小
}

// 完成对象上传及校验请求。
message CompleteStorageObjectReq {
  int64 id = 1; // 存储对象ID
  int64 size_bytes = 2; // 服务端验证后的对象大小
  string sha256 = 3; // 服务端流式计算的SHA-256
}

// 标记对象上传失败请求。
message FailStorageObjectReq {
  int64 id = 1; // 存储对象ID
}

// 待回收的过期上传对象。
message ExpiredStorageObject {
  int64 id = 1; // 存储对象ID
  string object_key = 2; // 待删除的私有对象Key
}

// Builder领取过期上传对象清理批次请求。
message ClaimExpiredStorageObjectsReq {
  int64 stale_seconds = 1; // 判定上传过期的秒数
  int32 limit = 2; // 单次最多领取数量
}

// Builder领取过期上传对象清理批次响应。
message ClaimExpiredStorageObjectsResp {
  common.RespBase base = 1; // 通用响应
  repeated ExpiredStorageObject data = 2; // 待删除对象列表
}

// Builder确认物理对象已删除请求。
message MarkStorageObjectDeletedReq {
  int64 id = 1; // 存储对象ID
  string object_key = 2; // 已删除的私有对象Key
}

// 查询存储对象请求。
message StorageObjectIdReq {
  int64 id = 1; // 存储对象ID
}

// 存储对象响应。
message StorageObjectResp {
  common.RespBase base = 1; // 通用响应
  StorageObject data = 2; // 存储对象
}

message CreateBuildTaskReq {
  int64 app_id = 1;
  int64 version_id = 2;
  int64 channel_id = 3;
  int64 signing_config_id = 4;
  int32 priority = 5;
  int64 branding_profile_id = 6; // 可选品牌配置ID，0表示沿用V1构建
  int64 white_label_product_id = 7; // 可选V3白标产品ID，提供后由产品覆盖品牌和签名配置
}

// 创建V3白标模板请求。
message CreateWhiteLabelTemplateReq {
  int64 app_id = 1; // 应用ID
  string template_code = 2; // 租户内唯一模板编码
  string template_name = 3; // 模板名称
  int64 source_version_id = 4; // 源应用版本ID
  string parameter_schema_json = 5; // 参数JSON Schema
  string compatibility_rules_json = 6; // 兼容规则JSON
}
// 更新尚未发布的V3白标模板请求。
message UpdateWhiteLabelTemplateReq {
  int64 id = 1; // 白标模板ID
  string template_name = 2; // 模板名称
  int64 source_version_id = 3; // 源应用版本ID
  string parameter_schema_json = 4; // 参数JSON Schema
  string compatibility_rules_json = 5; // 兼容规则JSON
}
// 复制V3白标模板请求，复制后的修订均为草稿。
message CopyWhiteLabelTemplateReq {
  int64 id = 1; // 来源白标模板ID
  string template_code = 2; // 新模板编码
  string template_name = 3; // 新模板名称
  int64 source_version_id = 4; // 可选新源版本ID，0表示沿用来源模板
}
// 创建V3白标模板修订请求，修订号由服务端递增。
message CreateWhiteLabelTemplateRevisionReq {
  int64 template_id = 1; // 白标模板ID
  string package_name_rule_json = 2; // 动态包名规则JSON
  string manifest_patch_json = 3; // Manifest声明式补丁JSON
  string resource_patch_json = 4; // 资源声明式补丁JSON
  string extension_files_json = 5; // 受控扩展文件JSON
  string expected_artifacts_json = 6; // 产物验收规则JSON
}
// 更新V3白标模板草稿修订请求，已发布修订不可修改。
message UpdateWhiteLabelTemplateRevisionReq {
  int64 template_id = 1; // 白标模板ID
  int32 revision = 2; // 草稿修订号
  string package_name_rule_json = 3; // 动态包名规则JSON
  string manifest_patch_json = 4; // Manifest声明式补丁JSON
  string resource_patch_json = 5; // 资源声明式补丁JSON
  string extension_files_json = 6; // 受控扩展文件JSON
  string expected_artifacts_json = 7; // 产物验收规则JSON
}
// 发布V3白标模板修订请求。
message PublishWhiteLabelTemplateReq {
  int64 id = 1; // 白标模板ID
  int32 revision = 2; // 待发布修订号
}
// 创建V3白标产品请求。
message CreateWhiteLabelProductReq {
  int64 app_id = 1; // 应用ID
  string product_code = 2; // 租户内唯一产品编码
  string product_name = 3; // 产品名称
  int64 template_id = 4; // 白标模板ID
  int32 template_revision = 5; // 已发布模板修订号
  int64 branding_profile_id = 6; // 品牌配置ID
  string package_name = 7; // 目标Android applicationId
  int64 signing_config_id = 8; // 独立签名配置ID
  string parameter_values_json = 9; // 模板参数值JSON
}
// 更新V3白标产品请求。
message UpdateWhiteLabelProductReq {
  int64 id = 1; // 白标产品ID
  string product_name = 2; // 产品名称
  int64 branding_profile_id = 3; // 品牌配置ID
  string package_name = 4; // 目标Android applicationId
  int64 signing_config_id = 5; // 独立签名配置ID
  string parameter_values_json = 6; // 模板参数值JSON
	int64 template_id = 7; // 新的白标模板ID，停用产品后允许切换
	int32 template_revision = 8; // 新的已发布模板修订号
}
// 修改V3白标模板状态请求。
message ChangeWhiteLabelTemplateStatusReq {
	int64 id = 1; // 白标模板ID
	WhiteLabelTemplateStatus status = 2; // 目标模板状态
}
// 修改V3白标产品状态请求。
message ChangeWhiteLabelProductStatusReq {
  int64 id = 1; // 白标产品ID
  WhiteLabelProductStatus status = 2; // 目标产品状态
}

// 创建品牌配置请求。
message CreateBrandingProfileReq {
  int64 app_id = 1; // 应用ID
  string profile_name = 2; // 品牌配置名称
  string app_name = 3; // 构建后的应用展示名称
  int64 logo_object_id = 4; // 已校验的品牌Logo对象ID
  int64 splash_object_id = 5; // 已校验的品牌启动图对象ID
  string api_host = 6; // 构建后的业务API地址
  BrandingRewriteMode rewrite_mode = 7; // 品牌资源改写模式
  string launcher_icon_target = 8; // Launcher图标资源目标
  string splash_resource_target = 9; // 启动图资源目标
  string runtime_config_json = 10; // 运行时契约扩展配置JSON
}

// 更新品牌配置请求，成功后修订号自动递增。
message UpdateBrandingProfileReq {
  int64 id = 1; // 品牌配置ID
  string profile_name = 2; // 品牌配置名称
  string app_name = 3; // 构建后的应用展示名称
  int64 logo_object_id = 4; // 已校验的品牌Logo对象ID
  int64 splash_object_id = 5; // 已校验的品牌启动图对象ID
  string api_host = 6; // 构建后的业务API地址
  BrandingRewriteMode rewrite_mode = 7; // 品牌资源改写模式
  string launcher_icon_target = 8; // Launcher图标资源目标
  string splash_resource_target = 9; // 启动图资源目标
  string runtime_config_json = 10; // 运行时契约扩展配置JSON
}

// 修改品牌配置状态请求。
message ChangeBrandingProfileStatusReq {
  int64 id = 1; // 品牌配置ID
  BrandingProfileStatus status = 2; // 目标状态
}

// 创建品牌兼容性预检请求。
message CreateBrandingPreflightReq {
  int64 branding_profile_id = 1; // 品牌配置ID
  int64 version_id = 2; // 待检查的应用版本ID
}

// 完成品牌兼容性预检请求，仅供可信Builder调用。
message CompleteBrandingPreflightReq {
  int64 id = 1; // 预检记录ID
  BrandingPreflightStatus status = 2; // 兼容、不兼容或执行失败
  string report_json = 3; // 结构化预检报告JSON
  string toolchain_version = 4; // 预检工具链版本
  string builder_id = 5; // 当前预检Builder节点ID
  int32 builder_attempt = 6; // 预检领取代次，用于阻止过期Worker回写
}

// Builder领取品牌预检请求。
message ClaimBrandingPreflightReq {
  string builder_id = 1; // Builder工作节点ID
  int32 lease_seconds = 2; // 预检租约秒数
}

// Builder品牌预检执行上下文。
message BrandingPreflightExecutionContext {
  BrandingPreflight preflight = 1; // 已领取的预检记录
  BrandingProfile profile = 2; // 对应品牌配置修订
  Version version = 3; // 待检查应用版本
  StorageObject source_apk = 4; // 原始APK私有对象
  StorageObject brand_logo = 5; // 品牌Logo私有对象
  StorageObject brand_splash = 6; // 品牌启动图私有对象
}

// Builder品牌预检执行上下文响应，无待处理任务时data为空。
message BrandingPreflightExecutionContextResp {
  common.RespBase base = 1; // 通用响应
  BrandingPreflightExecutionContext data = 2; // 品牌预检执行上下文
}

message InstallReportReq {
  int64 app_id = 1;
  string channel_code = 2;
  string install_id = 3;
  string app_version = 4;
  string device_model = 5;
  string ip = 6;
  int64 first_open_time = 7;
}

message ChannelStatsReq {
  int64 app_id = 1;
  int64 channel_id = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

message ChannelStats {
  int64 channel_id = 1;
  string channel_code = 2;
  int64 clicks = 3;
  int64 downloads = 4;
  int64 installs = 5;
  int64 registrations = 6;
  int64 first_pays = 7;
  int64 pays = 8;
}

message ChannelStatsResp {
  common.RespBase base = 1;
  ChannelStats data = 2;
}

// 渠道转化事件上报。
message ReportChannelEventReq {
  int64 app_id = 1;
  string channel_code = 2;
  int32 event_type = 3; // 1点击 2下载 4注册 5首充 6付费
  string event_key = 4;
  string install_id = 5;
  int64 user_id = 6;
  string app_version = 7;
  string ip = 8;
  string device_model = 9;
  int64 event_time = 10;
  string metadata = 11;
}

// 公开渠道下载解析请求。event_key 由可信 API 根据客户端匿名标识生成。
message ResolveChannelDownloadReq {
  string channel_code = 1; // 全局唯一渠道编码
  string event_key = 2; // 下载访问幂等键
  string ip = 3; // 客户端IP
  string user_agent = 4; // 客户端User-Agent
}

// 公开渠道下载解析结果，不包含对象存储访问凭据。
message ChannelDownloadArtifact {
  int64 tenant_id = 1; // 所属租户ID
  int64 app_id = 2; // 应用ID
  int64 channel_id = 3; // 渠道ID
  string channel_code = 4; // 渠道编码
  int64 build_task_id = 5; // 最新成功构建任务ID
  int64 object_id = 6; // 构建产物对象ID
  string object_key = 7; // 私有对象Key
  string original_name = 8; // 下载文件名
  string content_type = 9; // MIME类型
}

// 公开渠道下载解析响应。
message ChannelDownloadArtifactResp {
  common.RespBase base = 1; // 通用响应
  ChannelDownloadArtifact data = 2; // 可下载构建产物
}

// Builder领取构建任务请求。
message ClaimBuildTaskReq {
  string builder_id = 1; // Builder工作节点ID
  int32 lease_seconds = 2; // 租约秒数
}

// Builder续租构建任务请求。
message HeartbeatBuildTaskReq {
  int64 task_id = 1; // 构建任务ID
  string builder_id = 2; // Builder工作节点ID
  int32 lease_seconds = 3; // 租约秒数
  int32 builder_attempt = 4; // 本次领取代次，用于阻止过期Worker回写
}

// Builder回报构建进度请求。
message ReportBuildProgressReq {
  int64 task_id = 1; // 构建任务ID
  string builder_id = 2; // Builder工作节点ID
  BuildTaskStatus status = 3; // 当前构建任务状态
  string message = 4; // 进度说明
  int32 progress = 5; // 进度百分比
  int32 builder_attempt = 6; // 本次领取代次，用于阻止过期Worker回写
}

// Builder回报构建成功请求。
message CompleteBuildTaskReq {
  int64 task_id = 1; // 构建任务ID
  string builder_id = 2; // Builder工作节点ID
  string apk_url = 3; // APK下载地址
  string apk_sha256 = 4; // APK SHA-256
  int64 apk_size = 5; // APK大小（字节）
  string log_url = 6; // 构建日志地址
  string apk_object_key = 7; // 构建产物私有对象Key
  string log_object_key = 8; // 构建日志私有对象Key
  string log_sha256 = 9; // 构建日志SHA-256
  int64 log_size = 10; // 构建日志大小，单位字节
  int32 builder_attempt = 11; // 本次领取代次，用于阻止过期Worker回写
}

// Builder回报构建失败请求。
message FailBuildTaskReq {
  int64 task_id = 1; // 构建任务ID
  string builder_id = 2; // Builder工作节点ID
  string error_message = 3; // 失败原因
  string log_url = 4; // 构建日志地址
  string log_object_key = 5; // 构建日志私有对象Key
  string log_sha256 = 6; // 构建日志SHA-256
  int64 log_size = 7; // 构建日志大小，单位字节
  int32 builder_attempt = 8; // 本次领取代次，用于阻止过期Worker回写
}

// Builder读取已领取任务的完整执行上下文请求。
message GetBuildExecutionContextReq {
  int64 task_id = 1; // 构建任务ID
  string builder_id = 2; // 当前租约持有者ID
  int32 builder_attempt = 3; // 本次领取代次，用于阻止过期Worker读取敏感上下文
}

// Builder内部执行上下文，包含敏感信息，不允许通过HTTP接口暴露。
message BuildExecutionContext {
  BuildTask task = 1; // 构建任务快照
  string package_name = 2; // 期望的Android包名
  string api_host = 3; // 注入APK的业务API地址
  string channel_name = 4; // 渠道名称
  string landing_url = 5; // 渠道落地页
  StorageObject source_apk = 6; // 原始APK私有对象
  StorageObject keystore = 7; // 签名文件私有对象
  string key_alias = 8; // 签名别名
  string keystore_password_ciphertext = 9; // Keystore密码密文
  string key_password_ciphertext = 10; // Key密码密文
  string secret_ref = 11; // 外部密钥服务引用
  string branding_snapshot_json = 12; // 构建时固化的品牌配置快照JSON
  StorageObject brand_logo = 13; // 品牌Logo私有对象
  StorageObject brand_splash = 14; // 品牌启动图私有对象
  string template_snapshot_json = 15; // V3模板和产品不可变构建快照JSON
  string signer_certificate_sha256 = 16; // 构建应使用的签名证书SHA-256指纹
  repeated StorageObject template_files = 17; // V3模板修订绑定的受控私有文件
}

// Builder内部执行上下文响应。
message BuildExecutionContextResp {
  common.RespBase base = 1; // 通用响应
  BuildExecutionContext data = 2; // 构建执行上下文
}

service Core {
  rpc CreateApplication(CreateApplicationReq) returns (ApplicationResp);
  rpc GetApplication(ApplicationIdReq) returns (ApplicationResp);
  rpc ListApplications(ApplicationListReq) returns (ApplicationListResp);

  // 创建待上传的私有存储对象元数据。
  rpc CreateStorageObject(CreateStorageObjectReq) returns (StorageObjectResp);
  // 查询当前租户的私有存储对象。
  rpc GetStorageObject(StorageObjectIdReq) returns (StorageObjectResp);
  // 完成上传校验并把对象置为可用。
  rpc CompleteStorageObject(CompleteStorageObjectReq) returns (StorageObjectResp);
  // 标记上传或校验失败。
  rpc FailStorageObject(FailStorageObjectReq) returns (RespBase);
  // 领取超时未完成或失败的上传对象，供后台清理物理文件。
  rpc ClaimExpiredStorageObjects(ClaimExpiredStorageObjectsReq) returns (ClaimExpiredStorageObjectsResp);
  // 确认物理对象已删除并把元数据置为已删除。
  rpc MarkStorageObjectDeleted(MarkStorageObjectDeletedReq) returns (RespBase);

  rpc CreateVersion(CreateVersionReq) returns (VersionResp);
  rpc GetVersion(VersionIdReq) returns (VersionResp);
  rpc ListVersions(VersionListReq) returns (VersionListResp);

  rpc CreateChannel(CreateChannelReq) returns (ChannelResp);
  rpc GetChannel(ChannelIdReq) returns (ChannelResp);
  rpc ListChannels(ChannelListReq) returns (ChannelListResp);

  rpc CreateSigningConfig(CreateSigningConfigReq) returns (SigningConfigResp);
  rpc GetSigningConfig(SigningConfigIdReq) returns (SigningConfigResp);
  rpc ListSigningConfigs(SigningConfigListReq) returns (SigningConfigListResp);

  // 创建应用品牌配置。
  rpc CreateBrandingProfile(CreateBrandingProfileReq) returns (BrandingProfileResp);
  // 更新应用品牌配置并递增修订号。
  rpc UpdateBrandingProfile(UpdateBrandingProfileReq) returns (BrandingProfileResp);
  // 查询当前租户的品牌配置。
  rpc GetBrandingProfile(BrandingProfileIdReq) returns (BrandingProfileResp);
  // 分页查询当前租户的品牌配置。
  rpc ListBrandingProfiles(BrandingProfileListReq) returns (BrandingProfileListResp);
  // 修改品牌配置状态。
  rpc ChangeBrandingProfileStatus(ChangeBrandingProfileStatusReq) returns (BrandingProfileResp);
  // 创建或重置品牌兼容性预检记录。
  rpc CreateBrandingPreflight(CreateBrandingPreflightReq) returns (BrandingPreflightResp);
  // 查询品牌兼容性预检记录。
  rpc GetBrandingPreflight(BrandingPreflightIdReq) returns (BrandingPreflightResp);
  // 分页查询品牌兼容性预检记录。
  rpc ListBrandingPreflights(BrandingPreflightListReq) returns (BrandingPreflightListResp);
  // 原子领取一个待处理或租约过期的品牌兼容性预检。
  rpc ClaimBrandingPreflight(ClaimBrandingPreflightReq) returns (BrandingPreflightExecutionContextResp);
  // 完成品牌兼容性预检。
  rpc CompleteBrandingPreflight(CompleteBrandingPreflightReq) returns (BrandingPreflightResp);

  // 创建V3白标模板。
  rpc CreateWhiteLabelTemplate(CreateWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
  // 更新尚未发布的V3白标模板。
  rpc UpdateWhiteLabelTemplate(UpdateWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
  // 复制V3白标模板及其修订为新草稿。
  rpc CopyWhiteLabelTemplate(CopyWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
  // 删除从未发布且未被产品引用的V3白标模板。
  rpc DeleteWhiteLabelTemplate(WhiteLabelTemplateIdReq) returns (RespBase);
  // 查询V3白标模板。
  rpc GetWhiteLabelTemplate(WhiteLabelTemplateIdReq) returns (WhiteLabelTemplateResp);
  // 分页查询V3白标模板。
  rpc ListWhiteLabelTemplates(WhiteLabelTemplateListReq) returns (WhiteLabelTemplateListResp);
  // 创建不可变模板修订。
  rpc CreateWhiteLabelTemplateRevision(CreateWhiteLabelTemplateRevisionReq) returns (WhiteLabelTemplateRevisionResp);
  // 查询单个模板修订。
  rpc GetWhiteLabelTemplateRevision(WhiteLabelTemplateRevisionIdReq) returns (WhiteLabelTemplateRevisionResp);
  // 更新尚未发布的模板草稿修订。
  rpc UpdateWhiteLabelTemplateRevision(UpdateWhiteLabelTemplateRevisionReq) returns (WhiteLabelTemplateRevisionResp);
  // 删除尚未发布的模板草稿修订。
  rpc DeleteWhiteLabelTemplateRevision(WhiteLabelTemplateRevisionIdReq) returns (RespBase);
  // 查询模板修订。
  rpc ListWhiteLabelTemplateRevisions(WhiteLabelTemplateRevisionListReq) returns (WhiteLabelTemplateRevisionListResp);
  // 发布模板修订。
  rpc PublishWhiteLabelTemplate(PublishWhiteLabelTemplateReq) returns (WhiteLabelTemplateResp);
	// 修改V3白标模板状态。
	rpc ChangeWhiteLabelTemplateStatus(ChangeWhiteLabelTemplateStatusReq) returns (WhiteLabelTemplateResp);
  // 创建V3白标产品。
  rpc CreateWhiteLabelProduct(CreateWhiteLabelProductReq) returns (WhiteLabelProductResp);
  // 更新V3白标产品。
  rpc UpdateWhiteLabelProduct(UpdateWhiteLabelProductReq) returns (WhiteLabelProductResp);
  // 删除未启用且没有历史构建的V3白标产品。
  rpc DeleteWhiteLabelProduct(WhiteLabelProductIdReq) returns (RespBase);
  // 查询V3白标产品。
  rpc GetWhiteLabelProduct(WhiteLabelProductIdReq) returns (WhiteLabelProductResp);
  // 分页查询V3白标产品。
  rpc ListWhiteLabelProducts(WhiteLabelProductListReq) returns (WhiteLabelProductListResp);
  // 修改V3白标产品状态。
  rpc ChangeWhiteLabelProductStatus(ChangeWhiteLabelProductStatusReq) returns (WhiteLabelProductResp);
  // 同步预检V3白标产品契约和依赖。
  rpc PreflightWhiteLabelProduct(WhiteLabelProductIdReq) returns (WhiteLabelProductPreflightResp);

  rpc CreateBuildTask(CreateBuildTaskReq) returns (BuildTaskResp);
  rpc GetBuildTask(BuildTaskIdReq) returns (BuildTaskResp);
  rpc ListBuildTasks(BuildTaskListReq) returns (BuildTaskListResp);

  rpc ReportInstall(InstallReportReq) returns (RespBase);
  rpc ReportChannelEvent(ReportChannelEventReq) returns (RespBase);
  rpc GetChannelStats(ChannelStatsReq) returns (ChannelStatsResp);
  // 解析渠道最新成功产物并幂等记录点击、下载事件。
  rpc ResolveChannelDownload(ResolveChannelDownloadReq) returns (ChannelDownloadArtifactResp);

  rpc ClaimBuildTask(ClaimBuildTaskReq) returns (BuildTaskResp);
  // 读取当前Builder已领取任务的内部执行上下文。
  rpc GetBuildExecutionContext(GetBuildExecutionContextReq) returns (BuildExecutionContextResp);
  rpc HeartbeatBuildTask(HeartbeatBuildTaskReq) returns (RespBase);
  rpc ReportBuildProgress(ReportBuildProgressReq) returns (RespBase);
  rpc CompleteBuildTask(CompleteBuildTaskReq) returns (RespBase);
  rpc FailBuildTask(FailBuildTaskReq) returns (RespBase);
}
