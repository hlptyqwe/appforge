message EnqueueSourceWebhookEventReq {
  int64 trigger_id = 1; // 已解析且签名验证通过的触发策略ID
  string provider_event_id = 2; // 供应商投递事件唯一ID
  string provider_event_type = 3; // 供应商原始事件类型
  string external_repository_id = 4; // 供应商仓库ID
  string source_ref = 5; // Tag或分支
  string commit_sha = 6; // Commit SHA
  SourceArtifactType artifact_source = 7; // Artifact来源
  string external_artifact_id = 8; // 供应商Artifact或Job ID
  string release_ref = 9; // Release Tag
  string pipeline_ref = 10; // Pipeline或Workflow标识
  string job_ref = 11; // Job标识
  string payload_sha256 = 12; // 原始请求体SHA-256
}

// V5 源码Webhook入队结果。
message EnqueueSourceWebhookEventResult {
  SourceWebhookEvent event = 1; // 已存在或新建的可靠事件
  bool accepted = 2; // true表示本次首次入队，false表示幂等重放
}

// V5 源码Webhook入队响应。
message EnqueueSourceWebhookEventResp {
  common.RespBase base = 1; // 通用响应
  EnqueueSourceWebhookEventResult data = 2; // 入队结果
}

// V5 Worker领取源码Webhook事件请求。
message ClaimSourceWebhookEventReq {
  string worker_id = 1; // Worker唯一实例标识
  int32 lease_seconds = 2; // 处理租约秒数
}

// V5 Worker领取源码Webhook事件结果。
message ClaimedSourceWebhookEvent {
  SourceWebhookEvent event = 1; // 已领取事件
  SourceBuildTrigger trigger = 2; // 固化的预定义构建策略
}

// V5 Worker领取源码Webhook事件响应；无任务时data为空。
message ClaimSourceWebhookEventResp {
  common.RespBase base = 1; // 通用响应
  ClaimedSourceWebhookEvent data = 2; // 已领取事件和策略
}

// V5 Worker完成源码Webhook事件请求。
message CompleteSourceWebhookEventReq {
  int64 id = 1; // 入站事件ID
  int64 version_id = 2; // 导入成功的版本ID
  repeated int64 build_task_ids = 3; // 创建成功的构建任务ID
  string commit_sha = 4; // Provider API最终确认的Commit SHA
}

// V5 Worker失败源码Webhook事件请求。
message FailSourceWebhookEventReq {
  int64 id = 1; // 入站事件ID
  string error_message = 2; // 已脱敏错误摘要
  bool retryable = 3; // 是否允许指数退避重试
}

// V5 源码Webhook事件列表请求。
