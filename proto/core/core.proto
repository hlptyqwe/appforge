syntax = "proto3";

package core;

import "proto/common/common.proto";

option go_package = "appforge/proto/core;core";

message RespBase {
  common.RespBase base = 1;
}

// 应用状态。
enum ApplicationStatus {
  APPLICATION_STATUS_UNKNOWN = 0; // 未知
  APPLICATION_STATUS_ENABLED = 1; // 启用
  APPLICATION_STATUS_DISABLED = 2; // 停用
}

// 应用版本状态。
enum VersionStatus {
  VERSION_STATUS_UNKNOWN = 0; // 未知
  VERSION_STATUS_DRAFT = 1; // 草稿
  VERSION_STATUS_PUBLISHED = 2; // 已发布
  VERSION_STATUS_DISABLED = 3; // 已停用
}

// 推广渠道状态。
enum ChannelStatus {
  CHANNEL_STATUS_UNKNOWN = 0; // 未知
  CHANNEL_STATUS_ENABLED = 1; // 启用
  CHANNEL_STATUS_DISABLED = 2; // 停用
}

// APK 构建任务状态。
enum BuildTaskStatus {
  BUILD_TASK_STATUS_UNKNOWN = 0; // 未知
  BUILD_TASK_STATUS_PENDING = 1; // 待处理
  BUILD_TASK_STATUS_BUILDING = 2; // 构建中
  BUILD_TASK_STATUS_SIGNING = 3; // 签名中
  BUILD_TASK_STATUS_UPLOADING = 4; // 上传中
  BUILD_TASK_STATUS_SUCCESS = 5; // 成功
  BUILD_TASK_STATUS_FAILED = 6; // 失败
  BUILD_TASK_STATUS_CANCELLED = 7; // 已取消
}

// 私有对象存储中的业务对象类型。
enum StorageObjectType {
  STORAGE_OBJECT_TYPE_UNKNOWN = 0; // 未知类型
  STORAGE_OBJECT_TYPE_SOURCE_APK = 1; // 客户上传的原始APK
  STORAGE_OBJECT_TYPE_KEYSTORE = 2; // APK签名文件
  STORAGE_OBJECT_TYPE_BUILT_APK = 3; // Builder生成的渠道APK
  STORAGE_OBJECT_TYPE_BUILD_LOG = 4; // Builder构建日志
  STORAGE_OBJECT_TYPE_BRAND_LOGO = 5; // 品牌Logo图片
  STORAGE_OBJECT_TYPE_BRAND_SPLASH = 6; // 品牌启动图图片
  STORAGE_OBJECT_TYPE_TEMPLATE_FILE = 7; // V3模板声明式补丁引用的受控文件
  STORAGE_OBJECT_TYPE_BUILD_CACHE = 8; // V4独立构建缓存产物
}

// V4 Builder节点状态。
enum BuilderNodeStatus {
  BUILDER_NODE_STATUS_UNKNOWN = 0; // 未知状态
  BUILDER_NODE_STATUS_ONLINE = 1; // 在线且健康
  BUILDER_NODE_STATUS_OFFLINE = 2; // 心跳超时离线
  BUILDER_NODE_STATUS_ISOLATED = 3; // 因容量、工具链或连续失败被隔离
}

// V4 Builder节点排空状态。
enum BuilderDrainStatus {
  BUILDER_DRAIN_STATUS_UNKNOWN = 0; // 未知状态
  BUILDER_DRAIN_STATUS_ACCEPTING = 1; // 接收新任务
  BUILDER_DRAIN_STATUS_DRAINING = 2; // 排空中，不领取新任务
}

// V4 构建并发策略状态。
enum BuildPolicyStatus {
  BUILD_POLICY_STATUS_UNKNOWN = 0; // 未知状态
  BUILD_POLICY_STATUS_ENABLED = 1; // 启用
  BUILD_POLICY_STATUS_DISABLED = 2; // 停用
}

// V4 构建槽位租约状态。
enum BuildSlotLeaseStatus {
  BUILD_SLOT_LEASE_STATUS_UNKNOWN = 0; // 未知状态
  BUILD_SLOT_LEASE_STATUS_ACTIVE = 1; // 生效中
  BUILD_SLOT_LEASE_STATUS_RELEASED = 2; // 正常释放
  BUILD_SLOT_LEASE_STATUS_EXPIRED = 3; // 租约过期
  BUILD_SLOT_LEASE_STATUS_CANCELLED = 4; // 因任务取消释放
}

// V4 构建缓存作用域。
enum BuildCacheScope {
  BUILD_CACHE_SCOPE_UNKNOWN = 0; // 未知作用域
  BUILD_CACHE_SCOPE_TENANT_INTERMEDIATE = 1; // 租户隔离的白标中间APK，尚未注入任务渠道元数据和签名
  BUILD_CACHE_SCOPE_PLATFORM_INTERMEDIATE = 2; // 不含租户敏感信息的平台中间产物
}

// V4 构建缓存状态。
enum BuildCacheStatus {
  BUILD_CACHE_STATUS_UNKNOWN = 0; // 未知状态
  BUILD_CACHE_STATUS_ACTIVE = 1; // 有效
  BUILD_CACHE_STATUS_INVALIDATED = 2; // 已失效
  BUILD_CACHE_STATUS_EXPIRED = 3; // 已过期
}

// V4 调度事件类型。
enum BuildSchedulerEventType {
  BUILD_SCHEDULER_EVENT_TYPE_UNKNOWN = 0; // 未知事件
  BUILD_SCHEDULER_EVENT_TYPE_QUEUED = 1; // 任务进入队列
  BUILD_SCHEDULER_EVENT_TYPE_CLAIMED = 2; // 节点领取任务
  BUILD_SCHEDULER_EVENT_TYPE_THROTTLED = 3; // 并发或能力限制
  BUILD_SCHEDULER_EVENT_TYPE_RECOVERED = 4; // 租约恢复
  BUILD_SCHEDULER_EVENT_TYPE_DRAINED = 5; // 节点排空状态变化
  BUILD_SCHEDULER_EVENT_TYPE_CANCELLED = 6; // 任务取消
  BUILD_SCHEDULER_EVENT_TYPE_RETRIED = 7; // 任务重试
  BUILD_SCHEDULER_EVENT_TYPE_CACHE_HIT = 8; // 构建缓存命中
  BUILD_SCHEDULER_EVENT_TYPE_CACHE_INVALIDATED = 9; // 构建缓存失效
  BUILD_SCHEDULER_EVENT_TYPE_COMPLETED = 10; // 任务完成
  BUILD_SCHEDULER_EVENT_TYPE_FAILED = 11; // 任务失败
}

// V5 Open API凭证状态。
enum OpenApiCredentialStatus {
  OPEN_API_CREDENTIAL_STATUS_UNKNOWN = 0; // 未知状态
  OPEN_API_CREDENTIAL_STATUS_ACTIVE = 1; // 启用
  OPEN_API_CREDENTIAL_STATUS_ROTATION_GRACE = 2; // 轮换过渡期
  OPEN_API_CREDENTIAL_STATUS_REVOKED = 3; // 已吊销
  OPEN_API_CREDENTIAL_STATUS_EXPIRED = 4; // 已过期
}

// V5 Open API权限范围。
enum OpenApiScope {
  OPEN_API_SCOPE_UNKNOWN = 0; // 未知Scope
  OPEN_API_SCOPE_APPS_READ = 1; // 读取应用
  OPEN_API_SCOPE_APPS_WRITE = 2; // 管理应用
  OPEN_API_SCOPE_VERSIONS_READ = 3; // 读取版本
  OPEN_API_SCOPE_VERSIONS_WRITE = 4; // 管理版本
  OPEN_API_SCOPE_CHANNELS_READ = 5; // 读取渠道
  OPEN_API_SCOPE_CHANNELS_WRITE = 6; // 管理渠道
  OPEN_API_SCOPE_BRANDING_READ = 7; // 读取品牌和白标产品
  OPEN_API_SCOPE_BRANDING_WRITE = 8; // 管理品牌和白标产品
  OPEN_API_SCOPE_BUILDS_READ = 9; // 读取构建
  OPEN_API_SCOPE_BUILDS_WRITE = 10; // 创建、取消和重试构建
  OPEN_API_SCOPE_ARTIFACTS_READ = 11; // 下载构建产物
  OPEN_API_SCOPE_STATS_READ = 12; // 读取归因统计
}

// V5 Open API幂等键处理结果。
enum OpenApiIdempotencyDecision {
  OPEN_API_IDEMPOTENCY_DECISION_UNKNOWN = 0; // 未知结果
  OPEN_API_IDEMPOTENCY_DECISION_ACQUIRED = 1; // 当前请求取得执行权
  OPEN_API_IDEMPOTENCY_DECISION_REPLAY = 2; // 返回已完成请求的响应
  OPEN_API_IDEMPOTENCY_DECISION_IN_PROGRESS = 3; // 相同请求正在处理中
  OPEN_API_IDEMPOTENCY_DECISION_CONFLICT = 4; // 相同幂等键对应不同请求
}

// V5 Webhook端点状态。
enum WebhookEndpointStatus {
  WEBHOOK_ENDPOINT_STATUS_UNKNOWN = 0; // 未知状态
  WEBHOOK_ENDPOINT_STATUS_ACTIVE = 1; // 启用
  WEBHOOK_ENDPOINT_STATUS_PAUSED = 2; // 暂停
  WEBHOOK_ENDPOINT_STATUS_REVOKED = 3; // 已吊销
}

// V5 Webhook投递状态。
enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNKNOWN = 0; // 未知状态
  WEBHOOK_DELIVERY_STATUS_PENDING = 1; // 待投递
  WEBHOOK_DELIVERY_STATUS_DELIVERING = 2; // 投递中
  WEBHOOK_DELIVERY_STATUS_SUCCEEDED = 3; // 投递成功
  WEBHOOK_DELIVERY_STATUS_RETRYING = 4; // 等待重试
  WEBHOOK_DELIVERY_STATUS_DEAD_LETTER = 5; // 已进入死信
}

// V5 代码托管平台类型。
enum SourcePlatform {
  SOURCE_PLATFORM_UNKNOWN = 0; // 未知平台
  SOURCE_PLATFORM_GITHUB = 1; // GitHub App或OAuth
  SOURCE_PLATFORM_GITLAB = 2; // GitLab OAuth
}

// V5 代码平台集成状态。
enum SourceIntegrationStatus {
  SOURCE_INTEGRATION_STATUS_UNKNOWN = 0; // 未知状态
  SOURCE_INTEGRATION_STATUS_ACTIVE = 1; // 已连接且可用
  SOURCE_INTEGRATION_STATUS_DISCONNECTED = 2; // 已主动断开
  SOURCE_INTEGRATION_STATUS_ERROR = 3; // 安装或令牌同步异常
}

// V5 授权仓库状态。
enum SourceRepositoryStatus {
  SOURCE_REPOSITORY_STATUS_UNKNOWN = 0; // 未知状态
  SOURCE_REPOSITORY_STATUS_AUTHORIZED = 1; // 已授权只读访问
  SOURCE_REPOSITORY_STATUS_REVOKED = 2; // 已撤销授权
}

// V5 APK Artifact来源类型。
enum SourceArtifactType {
  SOURCE_ARTIFACT_TYPE_UNKNOWN = 0; // 未知来源
  SOURCE_ARTIFACT_TYPE_RELEASE = 1; // Release附件
  SOURCE_ARTIFACT_TYPE_CI_JOB = 2; // CI任务Artifact
}

// V5 源码平台预定义构建触发事件类型。
enum SourceBuildTriggerEventType {
  SOURCE_BUILD_TRIGGER_EVENT_TYPE_UNKNOWN = 0; // 未知事件
  SOURCE_BUILD_TRIGGER_EVENT_TYPE_RELEASE_PUBLISHED = 1; // Release发布事件
  SOURCE_BUILD_TRIGGER_EVENT_TYPE_CI_SUCCEEDED = 2; // CI流水线成功事件
}

// V5 源码平台预定义构建触发策略状态。
enum SourceBuildTriggerStatus {
  SOURCE_BUILD_TRIGGER_STATUS_UNKNOWN = 0; // 未知状态
  SOURCE_BUILD_TRIGGER_STATUS_ACTIVE = 1; // 启用并接受签名Webhook
  SOURCE_BUILD_TRIGGER_STATUS_DISABLED = 2; // 停用且拒绝Webhook
}

// V5 源码平台入站Webhook处理状态。
enum SourceWebhookEventStatus {
  SOURCE_WEBHOOK_EVENT_STATUS_UNKNOWN = 0; // 未知状态
  SOURCE_WEBHOOK_EVENT_STATUS_PENDING = 1; // 已可靠入队等待处理
  SOURCE_WEBHOOK_EVENT_STATUS_PROCESSING = 2; // Worker处理中
  SOURCE_WEBHOOK_EVENT_STATUS_SUCCEEDED = 3; // Artifact导入和构建任务创建成功
  SOURCE_WEBHOOK_EVENT_STATUS_IGNORED = 4; // 未满足预定义策略并已忽略
  SOURCE_WEBHOOK_EVENT_STATUS_FAILED = 5; // 达到重试上限后失败
}

// V6 套餐计费周期。
enum BillingCycle {
  BILLING_CYCLE_UNKNOWN = 0; // 未知周期
  BILLING_CYCLE_MONTHLY = 1; // 按月计费
  BILLING_CYCLE_YEARLY = 2; // 按年计费
}

// V6 套餐版本状态。
enum BillingPlanStatus {
  BILLING_PLAN_STATUS_UNKNOWN = 0; // 未知状态
  BILLING_PLAN_STATUS_ACTIVE = 1; // 可售且可订阅
  BILLING_PLAN_STATUS_RETIRED = 2; // 已退役，不影响历史订阅
}

// V6 租户订阅状态。
enum TenantSubscriptionStatus {
  TENANT_SUBSCRIPTION_STATUS_UNKNOWN = 0; // 未知状态
  TENANT_SUBSCRIPTION_STATUS_ACTIVE = 1; // 正常生效
  TENANT_SUBSCRIPTION_STATUS_PAST_DUE = 2; // 支付逾期
  TENANT_SUBSCRIPTION_STATUS_GRACE = 3; // 宽限期内
  TENANT_SUBSCRIPTION_STATUS_PAUSED = 4; // 已暂停，不允许新增消耗
  TENANT_SUBSCRIPTION_STATUS_CANCELED = 5; // 已取消
  TENANT_SUBSCRIPTION_STATUS_PENDING = 6; // 待支付或待人工确认
}

// V6 订阅来源。
enum TenantSubscriptionSource {
  TENANT_SUBSCRIPTION_SOURCE_UNKNOWN = 0; // 未知来源
  TENANT_SUBSCRIPTION_SOURCE_STRIPE = 1; // Stripe在线订阅
  TENANT_SUBSCRIPTION_SOURCE_MANUAL = 2; // 人工合同订阅
  TENANT_SUBSCRIPTION_SOURCE_GRANT = 3; // 平台赠送订阅
}

// V6 权益状态。
enum TenantEntitlementStatus {
  TENANT_ENTITLEMENT_STATUS_UNKNOWN = 0; // 未知状态
  TENANT_ENTITLEMENT_STATUS_ACTIVE = 1; // 当前生效
  TENANT_ENTITLEMENT_STATUS_PAUSED = 2; // 已暂停
}

// V6 用量指标。
enum BillingUsageMetric {
  BILLING_USAGE_METRIC_UNKNOWN = 0; // 未知指标
  BILLING_USAGE_METRIC_BUILD_STARTED = 1; // 启动构建次数
  BILLING_USAGE_METRIC_BUILD_SUCCEEDED = 2; // 成功构建次数
  BILLING_USAGE_METRIC_BUILD_COMPUTE_SECONDS = 3; // 构建计算秒数
  BILLING_USAGE_METRIC_STORAGE_SOURCE_BYTES = 4; // 原始与配置源文件存储字节
  BILLING_USAGE_METRIC_STORAGE_ARTIFACT_BYTES = 5; // 构建产物存储字节
  BILLING_USAGE_METRIC_STORAGE_LOG_BYTES = 6; // 构建日志存储字节
  BILLING_USAGE_METRIC_API_REQUESTS = 7; // Open API调用次数
  BILLING_USAGE_METRIC_TEAM_ACTIVE_SEATS = 8; // 团队活跃席位数快照
}

// V6 可预占额度指标。
enum QuotaMetric {
  QUOTA_METRIC_UNKNOWN = 0; // 未知额度
  QUOTA_METRIC_BUILD_COUNT = 1; // 周期构建次数
  QUOTA_METRIC_STORAGE_BYTES = 2; // 当前存储字节
  QUOTA_METRIC_TEAM_SEATS = 3; // 当前活跃席位
}

// V6 额度预占状态。
enum QuotaReservationStatus {
  QUOTA_RESERVATION_STATUS_UNKNOWN = 0; // 未知状态
  QUOTA_RESERVATION_STATUS_RESERVED = 1; // 已预占待确认
  QUOTA_RESERVATION_STATUS_CONFIRMED = 2; // 已确认并计量
  QUOTA_RESERVATION_STATUS_RELEASED = 3; // 已释放
  QUOTA_RESERVATION_STATUS_EXPIRED = 4; // 已过期释放
}

// V6 订阅套餐变更生效方式。
enum SubscriptionChangeMode {
  SUBSCRIPTION_CHANGE_MODE_UNKNOWN = 0; // 未知方式
  SUBSCRIPTION_CHANGE_MODE_IMMEDIATE = 1; // 立即生效，通常用于升级或人工恢复
  SUBSCRIPTION_CHANGE_MODE_PERIOD_END = 2; // 当前周期结束后生效，通常用于降级
}

// V6 账单状态。
enum InvoiceStatus {
  INVOICE_STATUS_UNKNOWN = 0; // 未知状态
  INVOICE_STATUS_DRAFT = 1; // 草稿
  INVOICE_STATUS_OPEN = 2; // 待支付
  INVOICE_STATUS_PAID = 3; // 已支付
  INVOICE_STATUS_PAYMENT_FAILED = 4; // 支付失败
  INVOICE_STATUS_VOID = 5; // 已作废
  INVOICE_STATUS_REFUNDED = 6; // 已退款
}

// V6 支付交易类型。
enum PaymentTransactionType {
  PAYMENT_TRANSACTION_TYPE_UNKNOWN = 0; // 未知类型
  PAYMENT_TRANSACTION_TYPE_CHARGE = 1; // 扣款
  PAYMENT_TRANSACTION_TYPE_REFUND = 2; // 退款
  PAYMENT_TRANSACTION_TYPE_DISPUTE = 3; // 争议
}

// V6 支付交易状态。
enum PaymentTransactionStatus {
  PAYMENT_TRANSACTION_STATUS_UNKNOWN = 0; // 未知状态
  PAYMENT_TRANSACTION_STATUS_PENDING = 1; // 处理中
  PAYMENT_TRANSACTION_STATUS_SUCCEEDED = 2; // 成功
  PAYMENT_TRANSACTION_STATUS_FAILED = 3; // 失败
  PAYMENT_TRANSACTION_STATUS_REVERSED = 4; // 已撤销
}

// V7 Local Agent运行状态。
enum LocalAgentStatus {
  LOCAL_AGENT_STATUS_UNKNOWN = 0; // 未知状态
  LOCAL_AGENT_STATUS_PENDING = 1; // 已创建，等待一次性注册
  LOCAL_AGENT_STATUS_ONLINE = 2; // 证书有效且心跳在线
  LOCAL_AGENT_STATUS_OFFLINE = 3; // 心跳超时
  LOCAL_AGENT_STATUS_REVOKED = 4; // 已吊销，证书和注册码均不可用
  LOCAL_AGENT_STATUS_UPGRADE_REQUIRED = 5; // 协议超出兼容窗口，只允许升级和轮换
}

// V7 Local Agent排空状态。
enum LocalAgentDrainStatus {
  LOCAL_AGENT_DRAIN_STATUS_UNKNOWN = 0; // 未知状态
  LOCAL_AGENT_DRAIN_STATUS_ACCEPTING = 1; // 接受新任务
  LOCAL_AGENT_DRAIN_STATUS_DRAINING = 2; // 排空中，不领取新任务
  LOCAL_AGENT_DRAIN_STATUS_DRAINED = 3; // 已排空
}

// V7 Hybrid Artifact存储模式。
enum HybridArtifactMode {
  HYBRID_ARTIFACT_MODE_UNKNOWN = 0; // 未知模式
  HYBRID_ARTIFACT_MODE_CONTROL_PLANE_STORAGE = 1; // 控制面私有对象存储
  HYBRID_ARTIFACT_MODE_CUSTOMER_STORAGE = 2; // 客户S3、MinIO或OSS
  HYBRID_ARTIFACT_MODE_AIR_GAPPED = 3; // 受签名离线任务包
}

// V7 Local Agent客户端证书状态。
enum LocalAgentCertificateStatus {
  LOCAL_AGENT_CERTIFICATE_STATUS_UNKNOWN = 0; // 未知状态
  LOCAL_AGENT_CERTIFICATE_STATUS_ACTIVE = 1; // 当前有效
  LOCAL_AGENT_CERTIFICATE_STATUS_ROTATED = 2; // 已完成轮换
  LOCAL_AGENT_CERTIFICATE_STATUS_REVOKED = 3; // 已吊销
  LOCAL_AGENT_CERTIFICATE_STATUS_EXPIRED = 4; // 已过期
}

// V7 Hybrid Artifact类型。
enum HybridArtifactType {
  HYBRID_ARTIFACT_TYPE_UNKNOWN = 0; // 未知类型
  HYBRID_ARTIFACT_TYPE_SOURCE_APK = 1; // 源APK
  HYBRID_ARTIFACT_TYPE_BUILT_APK = 2; // 构建APK
  HYBRID_ARTIFACT_TYPE_BUILD_LOG = 3; // 构建日志
  HYBRID_ARTIFACT_TYPE_OFFLINE_TASK_PACKAGE = 4; // 受签名离线任务包
}

// 存储对象生命周期状态。
enum StorageObjectStatus {
  STORAGE_OBJECT_STATUS_UNKNOWN = 0; // 未知状态
  STORAGE_OBJECT_STATUS_UPLOADING = 1; // 等待或正在上传
  STORAGE_OBJECT_STATUS_READY = 2; // 上传校验完成，可被业务绑定
  STORAGE_OBJECT_STATUS_BOUND = 3; // 已绑定到版本、签名配置或构建任务
  STORAGE_OBJECT_STATUS_DELETED = 4; // 已删除
  STORAGE_OBJECT_STATUS_FAILED = 5; // 上传或校验失败
}

// 品牌资源改写模式。
enum BrandingRewriteMode {
  BRANDING_REWRITE_MODE_UNKNOWN = 0; // 未知模式
  BRANDING_REWRITE_MODE_RESOURCE_REBUILD = 1; // 解包并替换Android资源后重建
  BRANDING_REWRITE_MODE_RUNTIME_CONTRACT = 2; // 写入AppForge运行时契约配置
}

// 品牌配置状态。
enum BrandingProfileStatus {
  BRANDING_PROFILE_STATUS_UNKNOWN = 0; // 未知状态
  BRANDING_PROFILE_STATUS_DRAFT = 1; // 草稿
  BRANDING_PROFILE_STATUS_ENABLED = 2; // 启用
  BRANDING_PROFILE_STATUS_DISABLED = 3; // 停用
}

// 品牌兼容性预检状态。
enum BrandingPreflightStatus {
  BRANDING_PREFLIGHT_STATUS_UNKNOWN = 0; // 未知状态
  BRANDING_PREFLIGHT_STATUS_PENDING = 1; // 待处理
  BRANDING_PREFLIGHT_STATUS_COMPATIBLE = 2; // 兼容
  BRANDING_PREFLIGHT_STATUS_INCOMPATIBLE = 3; // 不兼容
  BRANDING_PREFLIGHT_STATUS_FAILED = 4; // 预检执行失败
}

// V3白标模板状态。
enum WhiteLabelTemplateStatus {
  WHITE_LABEL_TEMPLATE_STATUS_UNKNOWN = 0; // 未知状态
  WHITE_LABEL_TEMPLATE_STATUS_DRAFT = 1; // 草稿
  WHITE_LABEL_TEMPLATE_STATUS_PUBLISHED = 2; // 已发布
  WHITE_LABEL_TEMPLATE_STATUS_DISABLED = 3; // 停用
}

// V3白标模板修订状态。
enum WhiteLabelRevisionStatus {
  WHITE_LABEL_REVISION_STATUS_UNKNOWN = 0; // 未知状态
  WHITE_LABEL_REVISION_STATUS_DRAFT = 1; // 草稿
  WHITE_LABEL_REVISION_STATUS_PUBLISHED = 2; // 已发布且不可变
  WHITE_LABEL_REVISION_STATUS_SUPERSEDED = 3; // 已被新修订取代
}

// V3白标产品状态。
enum WhiteLabelProductStatus {
  WHITE_LABEL_PRODUCT_STATUS_UNKNOWN = 0; // 未知状态
  WHITE_LABEL_PRODUCT_STATUS_DRAFT = 1; // 草稿
  WHITE_LABEL_PRODUCT_STATUS_ENABLED = 2; // 启用
  WHITE_LABEL_PRODUCT_STATUS_DISABLED = 3; // 停用
}

message Application {
  int64 id = 1;
  int64 tenant_id = 2;
  string app_code = 3;
  string app_name = 4;
  string package_name = 5;
  string description = 6;
  string icon_url = 7;
  string api_host = 8;
  ApplicationStatus status = 9; // 应用状态
  int64 create_by = 10;
  int64 create_time = 11;
  int64 update_time = 12;
}

message Version {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  int64 version_code = 4;
  string version_name = 5;
  string source_apk_url = 6;
  string source_apk_sha256 = 7;
  string release_notes = 8;
  string build_config_json = 9;
  VersionStatus status = 10; // 版本状态
  int64 published_at = 11;
  int64 create_by = 12;
  int64 create_time = 13;
  int64 update_time = 14;
  int64 source_apk_object_id = 15; // 原始APK存储对象ID
}

message Channel {
  int64 id = 1;
  int64 tenant_id = 2;
  int64 app_id = 3;
  string channel_code = 4;
  string channel_name = 5;
  string landing_url = 6;
  string download_url = 7;
  ChannelStatus status = 8; // 渠道状态
