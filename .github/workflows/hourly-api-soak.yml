name: hourly-api-soak

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hourly-api-soak.yml
      - deploy/acceptance/v7-api-soak.sh
      - deploy/acceptance/fixtures/soak-api.go
      - deploy/docker-compose.dev.yml
      - deploy/docker/**
      - deploy/etcd/**
      - deploy/mysql/**
      - appforge-api/**
      - common/**
      - proto/**
      - services/system/**
      - services/core/**
      - services/builder/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-api-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-source-compose-hour:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Free unused ephemeral runner toolchains
        run: |
          set -euo pipefail
          for unused_path in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            if [[ -d "$unused_path" ]]; then
              sudo rm -rf -- "$unused_path"
            fi
          done
          df -h /
      - name: Validate soak runner contract
        env:
          FIXTURE: ${{ runner.temp }}/soak-api-fixture
          PASSWORD_FILE: ${{ runner.temp }}/soak-fixture-password
          REPORT: ${{ runner.temp }}/v7-api-soak-smoke.json
        run: |
          set -euo pipefail
          go build -o "$FIXTURE" deploy/acceptance/fixtures/soak-api.go
          "$FIXTURE" -listen 127.0.0.1:18088 &
          fixture_pid=$!
          cleanup_fixture() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup_fixture EXIT
          for ((attempt = 1; attempt <= 10; attempt++)); do
            if curl -fsS http://127.0.0.1:18088/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          install -m 0600 /dev/null "$PASSWORD_FILE"
          printf '%s\n' 'synthetic-soak-password' >"$PASSWORD_FILE"
          APPFORGE_SOAK_API_URL=http://127.0.0.1:18088 \
          APPFORGE_SOAK_ADMIN_PASSWORD_FILE="$PASSWORD_FILE" \
          APPFORGE_SOAK_DURATION_SECONDS=10 \
          APPFORGE_SOAK_HEALTH_INTERVAL_MS=100 \
          APPFORGE_SOAK_READY_INTERVAL_MS=100 \
          APPFORGE_SOAK_DEPLOYMENT_INTERVAL_MS=100 \
          APPFORGE_SOAK_REPORT_FILE="$REPORT" \
            deploy/acceptance/v7-api-soak.sh
          jq -e '
            .result == "passed" and
            .runClass == "smoke" and
            .qualifiesHourLevel == false and
            .qualifiesDayLevel == false and
            ([.probes[].errors] | add) == 0 and
            ([.probes[] | (.requests >= .minimumRequests)] | all)
          ' "$REPORT"
          chmod 0644 "$PASSWORD_FILE"
          if APPFORGE_SOAK_API_URL=http://127.0.0.1:18088 \
            APPFORGE_SOAK_ADMIN_PASSWORD_FILE="$PASSWORD_FILE" \
            APPFORGE_SOAK_DURATION_SECONDS=10 \
            APPFORGE_SOAK_REPORT_FILE="$REPORT" \
              deploy/acceptance/v7-api-soak.sh >"${{ runner.temp }}/soak-insecure-password.log" 2>&1; then
            echo "insecure password file was unexpectedly accepted" >&2
            exit 1
          fi
          grep -q '不能向 group/others 开放' "${{ runner.temp }}/soak-insecure-password.log"
      - name: Build and start current-source platform
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.dev.yml build \
            admin-api builder-rpc system-rpc core-rpc etcd-init \
            2>&1 | tee "${{ runner.temp }}/compose-build.log"
          docker builder prune --all --force | tee "${{ runner.temp }}/builder-prune.log"
          docker image prune --force | tee "${{ runner.temp }}/image-prune.log"
          available_bytes=$(df --block-size=1 --output=avail / | tail -1 | tr -d ' ')
          printf '::notice title=Compose startup disk::availableBytes=%s\n' "$available_bytes"
          if (( available_bytes < 3221225472 )); then
            printf '::error title=Compose startup disk::less than 3 GiB available after build-cache cleanup; availableBytes=%s\n' "$available_bytes"
            exit 1
          fi
          docker compose -f deploy/docker-compose.dev.yml up -d --no-build admin-api builder-rpc
          for ((attempt = 1; attempt <= 180; attempt++)); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8888/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.dev.yml ps
          docker compose -f deploy/docker-compose.dev.yml logs --tail 200
          {
            for container in appforge-admin-api appforge-system-rpc appforge-core-rpc appforge-builder-rpc; do
              docker inspect --format '{{.Name}} state={{.State.Status}} exit={{.State.ExitCode}} restart={{.RestartCount}} error={{json .State.Error}}' "$container" || true
            done
            docker logs --tail 120 appforge-admin-api || true
          } >"${{ runner.temp }}/startup-admin-api-diagnostics.txt" 2>&1
          diagnostic_payload=$(gzip -c "${{ runner.temp }}/startup-admin-api-diagnostics.txt" | base64 -w0)
          printf '::error title=Admin API startup diagnostics (gzip+base64)::%s\n' "$diagnostic_payload"
          exit 1
      - name: Run authenticated one-hour API soak
        env:
          APPFORGE_SOAK_API_URL: http://127.0.0.1:8888
          APPFORGE_SOAK_ADMIN_USERNAME: appforge
          APPFORGE_SOAK_ADMIN_PASSWORD_FILE: ${{ runner.temp }}/soak-admin-password
          APPFORGE_SOAK_DURATION_SECONDS: "3600"
          APPFORGE_SOAK_HEALTH_CONCURRENCY: "2"
          APPFORGE_SOAK_READY_CONCURRENCY: "2"
          APPFORGE_SOAK_DEPLOYMENT_CONCURRENCY: "2"
          APPFORGE_SOAK_HEALTH_INTERVAL_MS: "500"
          APPFORGE_SOAK_READY_INTERVAL_MS: "500"
          APPFORGE_SOAK_DEPLOYMENT_INTERVAL_MS: "1000"
          APPFORGE_SOAK_MAX_ERRORS: "0"
          APPFORGE_SOAK_MAX_CONSECUTIVE_ERRORS: "0"
          APPFORGE_SOAK_REPORT_FILE: ${{ runner.temp }}/v7-api-soak-hour.json
          APPFORGE_SOAK_ENVIRONMENT_KIND: fixture
        run: |
          set -euo pipefail
          install -m 0600 /dev/null "$APPFORGE_SOAK_ADMIN_PASSWORD_FILE"
          printf '%s\n' 'AppForge@123' >"$APPFORGE_SOAK_ADMIN_PASSWORD_FILE"
          deploy/acceptance/v7-api-soak.sh
      - name: Verify hour evidence and zero restarts
        env:
          REPORT: ${{ runner.temp }}/v7-api-soak-hour.json
        run: |
          set -euo pipefail
          jq -e '
            .result == "passed" and
            .runClass == "hour" and
            .qualifiesHourLevel == true and
            .qualifiesDayLevel == false and
            .actualDurationSeconds >= 3600 and
            ([.probes[].errors] | add) == 0 and
            ([.probes[].maxConsecutiveErrors] | max) == 0 and
            ([.probes[] | (.requests >= .minimumRequests)] | all)
          ' "$REPORT"
          for container in \
            appforge-mysql appforge-redis appforge-etcd appforge-minio \
            appforge-system-rpc appforge-core-rpc appforge-builder-rpc appforge-admin-api; do
            [[ $(docker inspect -f '{{.State.Running}}' "$container") == true ]]
            [[ $(docker inspect -f '{{.RestartCount}}' "$container") == 0 ]]
          done
          docker compose -f deploy/docker-compose.dev.yml ps --format json >"${{ runner.temp }}/compose-ps.json"
          docker stats --no-stream --format '{{json .}}' >"${{ runner.temp }}/docker-stats.jsonl"
      - name: Collect service logs
        if: always()
        run: |
          docker compose -f deploy/docker-compose.dev.yml logs --no-color --timestamps >"${{ runner.temp }}/compose.log" 2>&1 || true
          docker system df >"${{ runner.temp }}/docker-system-df.txt" 2>&1 || true
          df -h >"${{ runner.temp }}/filesystem-df.txt" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hourly-api-soak-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v7-api-soak-hour.json
            ${{ runner.temp }}/compose-ps.json
            ${{ runner.temp }}/docker-stats.jsonl
            ${{ runner.temp }}/compose.log
            ${{ runner.temp }}/compose-build.log
            ${{ runner.temp }}/builder-prune.log
            ${{ runner.temp }}/image-prune.log
            ${{ runner.temp }}/docker-system-df.txt
            ${{ runner.temp }}/filesystem-df.txt
            ${{ runner.temp }}/startup-admin-api-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove synthetic platform
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v --remove-orphans
