name: release-security

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: system
            dockerfile: deploy/docker/go.Dockerfile
            build_args: MODULE_DIR=services/system
          - component: core
            dockerfile: deploy/docker/go.Dockerfile
            build_args: MODULE_DIR=services/core
          - component: builder
            dockerfile: deploy/docker/builder-rpc.Dockerfile
            build_args: ""
          - component: builder-worker
            dockerfile: deploy/docker/builder-worker.Dockerfile
            build_args: ""
          - component: api
            dockerfile: deploy/docker/go.Dockerfile
            build_args: MODULE_DIR=appforge-api
          - component: admin-ui
            dockerfile: deploy/docker/ui-production.Dockerfile
            build_args: |
              VITE_APP_MODE=admin
              VITE_APP_NAME=AppForge 管理端
          - component: agent-ui
            dockerfile: deploy/docker/ui-production.Dockerfile
            build_args: |
              VITE_APP_MODE=agent
              VITE_APP_NAME=AppForge 代理端
          - component: local-agent
            dockerfile: deploy/docker/local-agent.Dockerfile
            build_args: ""
          - component: egress-proxy
            dockerfile: deploy/docker/go.Dockerfile
            build_args: MODULE_DIR=common/cmd/egress-proxy
          - component: mysql
            dockerfile: deploy/docker/hardened-mysql.Dockerfile
            build_args: ""
          - component: etcd
            dockerfile: deploy/docker/hardened-etcd.Dockerfile
            build_args: ""
          - component: minio
            dockerfile: deploy/docker/hardened-minio.Dockerfile
            build_args: ""
          - component: minio-mc
            dockerfile: deploy/docker/hardened-minio-mc.Dockerfile
            build_args: ""
          - component: etcd-init
            dockerfile: deploy/docker/etcd-init.Dockerfile
            build_args: ""
          - component: migrate
            dockerfile: deploy/docker/migrate.Dockerfile
            build_args: |
              APPFORGE_SCHEMA_TARGET=20260815_113_v7_air_gapped
          - component: mysql-binlog-tools
            dockerfile: deploy/docker/mysql-binlog-tools.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable semantic-version metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/appforge/${{ matrix.component }}
          tags: type=semver,pattern={{version}}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/appforge/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json
      - name: Generate normalized license inventory
        run: |
          deploy/production/generate-license-inventory.sh \
            "${{ matrix.component }}" \
            "${{ matrix.component }}.spdx.json" \
            "${{ matrix.component }}.licenses.json"
      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/appforge/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: ${{ matrix.component }}.trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ matrix.component }}.trivy.sarif
          category: appforge-${{ matrix.component }}
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/appforge/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Keyless digest signing and verification
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/appforge/${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-security.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE}@${DIGEST}"
          cosign sign --yes "$image_ref"
          cosign verify "$image_ref" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output json > "${{ matrix.component }}.cosign.json"
          jq -e 'type == "array" and length > 0' "${{ matrix.component }}.cosign.json" >/dev/null
          printf '%s\n' "$image_ref" > ${{ matrix.component }}.image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.component }}
          if-no-files-found: error
          path: |
            ${{ matrix.component }}.spdx.json
            ${{ matrix.component }}.licenses.json
            ${{ matrix.component }}.trivy.sarif
            ${{ matrix.component }}.cosign.json
            ${{ matrix.component }}.image.txt

  third-party-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: redis
            image: redis:7.4-alpine
          - component: alpine
            image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable upstream digest
        id: resolve
        env:
          UPSTREAM_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker pull "$UPSTREAM_IMAGE"
          repository="${UPSTREAM_IMAGE%:*}"
          digest=$(docker image inspect "$UPSTREAM_IMAGE" --format '{{json .RepoDigests}}' | jq -r '.[0] | split("@")[1]')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_ref="$repository@$digest"
          printf '%s\n' "$digest_ref" > "third-party-${{ matrix.component }}.image.txt"
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
      - name: Generate third-party SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.resolve.outputs.digest_ref }}
          format: spdx-json
          output-file: third-party-${{ matrix.component }}.spdx.json
      - name: Generate third-party license inventory
        run: |
          deploy/production/generate-license-inventory.sh \
            "third-party-${{ matrix.component }}" \
            "third-party-${{ matrix.component }}.spdx.json" \
            "third-party-${{ matrix.component }}.licenses.json"
      - name: Generate third-party vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.resolve.outputs.digest_ref }}
          format: sarif
          output: third-party-${{ matrix.component }}.trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload third-party vulnerability report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: third-party-${{ matrix.component }}.trivy.sarif
          category: appforge-third-party-${{ matrix.component }}
      - name: Third-party vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.resolve.outputs.digest_ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-third-party-${{ matrix.component }}
          if-no-files-found: error
          path: |
            third-party-${{ matrix.component }}.spdx.json
            third-party-${{ matrix.component }}.licenses.json
            third-party-${{ matrix.component }}.trivy.sarif
            third-party-${{ matrix.component }}.image.txt

  source-dependency-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed dependency manifest and lockfile inputs
        run: |
          set -euo pipefail
          inputs=(
            appforge-api/go.mod appforge-api/go.sum
            appforgectl/go.mod
            appforge-ui/package.json appforge-ui/package-lock.json
            common/go.mod common/go.sum
            local-agent/go.mod local-agent/go.sum
            proto/builder/go.mod proto/builder/go.sum
            proto/common/go.mod proto/common/go.sum
            proto/core/go.mod proto/core/go.sum
            proto/system/go.mod proto/system/go.sum
            services/builder/go.mod services/builder/go.sum
            services/core/go.mod services/core/go.sum
            services/system/go.mod services/system/go.sum
          )
          for file in "${inputs[@]}"; do test -s "$file"; done
      - name: Source dependency vulnerability gate without report export
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  release-evidence:
    runs-on: ubuntu-24.04
    needs: [images, third-party-images, source-dependency-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          path: dist/release-input
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Assemble, sign and verify release evidence manifest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-security.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          APPFORGE_SOURCE_DEPENDENCY_GATE="${{ needs.source-dependency-gate.result }}" \
            deploy/production/assemble-release-evidence.sh \
            dist/release-input \
            dist/release-security \
            "$version" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF" \
            "$GITHUB_SHA"
          cosign sign-blob --yes \
            --bundle dist/release-security/SHA256SUMS.sigstore.json \
            dist/release-security/SHA256SUMS
          cosign verify-blob \
            --bundle dist/release-security/SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-security/SHA256SUMS
          APPFORGE_REQUIRE_COSIGN_VERIFY=1 \
          APPFORGE_COSIGN_BINARY="$(command -v cosign)" \
          APPFORGE_RELEASE_CERTIFICATE_IDENTITY="$CERTIFICATE_IDENTITY" \
            deploy/production/validate-release-evidence.sh \
              dist/release-security \
              "$version" \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/appforge"
      - uses: actions/upload-artifact@v4
        with:
          name: release-security-${{ github.ref_name }}
          if-no-files-found: error
          path: dist/release-security/

  delivery-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            appforge-api/go.sum
            appforgectl/go.mod
      - uses: sigstore/cosign-installer@v3
      - name: Build offline license tools
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd appforge-api && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/licensectl-linux-$arch" ./cmd/licensectl)
            (cd appforgectl && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/appforgectl-linux-$arch" .)
          done
          (cd dist && sha256sum appforgectl-linux-* licensectl-linux-* > SHA256SUMS)
      - name: Sign and verify delivery checksums
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-security.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-tools-${{ github.ref_name }}
          if-no-files-found: error
          path: dist/

  publish-release-assets:
    runs-on: ubuntu-24.04
    needs: [release-evidence, delivery-tools]
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Download signed release security evidence
        uses: actions/download-artifact@v4
        with:
          name: release-security-${{ github.ref_name }}
          path: dist/release-security-${{ github.ref_name }}
      - name: Download signed delivery tools
        uses: actions/download-artifact@v4
        with:
          name: delivery-tools-${{ github.ref_name }}
          path: dist/delivery-tools-${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Package, sign and verify public release assets
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-security.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          security_archive="appforge-release-security-${GITHUB_REF_NAME}.tar.gz"
          tools_archive="appforge-delivery-tools-${GITHUB_REF_NAME}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/release-assets/$security_archive" \
            -C dist "release-security-${GITHUB_REF_NAME}"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/release-assets/$tools_archive" \
            -C dist "delivery-tools-${GITHUB_REF_NAME}"
          (
            cd dist/release-assets
            sha256sum "$security_archive" "$tools_archive" > APPFORGE-RELEASE-ASSETS-SHA256SUMS
          )
          cosign sign-blob --yes \
            --bundle dist/release-assets/APPFORGE-RELEASE-ASSETS-SHA256SUMS.sigstore.json \
            dist/release-assets/APPFORGE-RELEASE-ASSETS-SHA256SUMS
          cosign verify-blob \
            --bundle dist/release-assets/APPFORGE-RELEASE-ASSETS-SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-assets/APPFORGE-RELEASE-ASSETS-SHA256SUMS
          (cd dist/release-assets && sha256sum -c APPFORGE-RELEASE-ASSETS-SHA256SUMS)
      - name: Publish anonymously downloadable GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(dist/release-assets/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "AppForge ${GITHUB_REF_NAME}" \
              --notes "Signed AppForge release security evidence and Linux delivery tools. Verify APPFORGE-RELEASE-ASSETS-SHA256SUMS with the attached Sigstore bundle before extraction."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-release-assets-${{ github.ref_name }}
          if-no-files-found: error
          path: dist/release-assets/
