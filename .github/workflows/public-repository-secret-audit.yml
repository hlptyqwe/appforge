name: public-repository-secret-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-history-high-confidence-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and full reachable history
        env:
          APPFORGE_PUBLIC_REPOSITORY_SECRET_AUDIT_REPORT_FILE: ${{ runner.temp }}/v7-public-repository-secret-audit.json
          APPFORGE_PUBLIC_REPOSITORY_SECRET_AUDIT_SELF_TEST: "true"
        run: deploy/acceptance/v7-public-repository-secret-audit.sh
      - name: Verify redacted machine evidence
        env:
          REPORT: ${{ runner.temp }}/v7-public-repository-secret-audit.json
        run: |
          jq -e '
            .result == "passed" and
            .scope.fullReachableHistory == true and
            .scope.reachableGitCommits > 0 and
            .scope.currentTrackedFiles > 0 and
            .outputPolicy.matchingBytesPrinted == false and
            .outputPolicy.findingsExposePathsOnly == true and
            .outputPolicy.credentialsIncludedInEvidence == false and
            .dataPolicy.customerDataAccessed == false and
            .dataPolicy.productionCredentialsAccessed == false and
            (.verified | index("current-and-full-history-high-confidence-pattern-scan") != null) and
            (.verified | index("only-explicit-synthetic-pattern-paths-allowed") != null) and
            (.verified | index("unreviewed-risk-named-file-absent") != null)
          ' "$REPORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-repository-secret-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/v7-public-repository-secret-audit.json
          if-no-files-found: error
          retention-days: 30
