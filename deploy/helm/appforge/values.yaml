global:
  deploymentMode: private
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  publicOrigin: ""
  offline: false

image:
  tag: ""
  pullPolicy: IfNotPresent

replicas:
  api: 2
  system: 2
  core: 2
  builder: 2
  builderWorker: 2
  worker: 2
  sourceWorker: 1
  ui: 2
  egressProxy: 2

external:
  etcdEndpoints: https://etcd-client.database.svc:2379
  etcdAuthSecret: appforge-etcd-client
  runtimeConfigSecret: appforge-runtime-config
  migrationSecret: appforge-migration

secrets:
  localAgentCaSecret: appforge-local-agent-ca
  offlineLicenseSecret: appforge-offline-license
  siemSecret: appforge-siem

offlineLicense:
  enabled: true
  deploymentId: ""
  # 多副本共享的RWX持久卷；保存防时钟/许可证回退状态。
  existingStateClaim: ""

ingress:
  enabled: true
  className: nginx
  host: ""
  adminHost: ""
  tlsSecretName: appforge-tls

localAgentGateway:
  enabled: true
  serviceType: LoadBalancer
  port: 9443

resources:
  api: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  rpc: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  worker: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "4", memory: 4Gi}}
  ui: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

networkPolicy:
  enabled: true
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx
  # 兼容旧配置；新交付禁止使用该全端口规则，改用 externalEgressRules。
  egressCIDRs: []
  # 集群外依赖必须同时限定使用组件、CIDR 和端口；客户交付时按实际网络填写。
  externalEgressRules: []

# 可选内置 HTTPS CONNECT-only 出口代理。启用时通用 HTTPS 客户端流量只经该
# Service 出站；远程 APK 签名和 Webhook 继续显式绕过通用代理。
# 同时必须为 component=egress-proxy 配置按目标 IP/端口限定的出口规则。
egressProxy:
  enabled: false
  url: http://appforge-egress-proxy:3128
  noProxy: localhost,127.0.0.1,.svc,.cluster.local
  maximumConnections: 256
  allowlist: []

observability:
  prometheus: true
  metricsPort: 9101
  metricsPath: /metrics
  prometheusNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
  otlpEndpoint: ""
  otlpSampler: 0.1
  # 兼容字段名；支持 https:// Webhook 或 syslog+tls://host:6514。
  siemWebhook: ""

upgrade:
  schemaVersion: "20260815_113_v7_air_gapped"
  maxVersionSkew: 1
