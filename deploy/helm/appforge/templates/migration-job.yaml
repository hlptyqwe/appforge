apiVersion: batch/v1
kind: Job
metadata:
  name: "appforge-migrate-{{ .Release.Revision }}"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}/migrate:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--expected={{ .Values.upgrade.schemaVersion }}"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          env:
            - {name: APPFORGE_PUBLIC_ORIGIN, value: {{ .Values.global.publicOrigin | quote }}}
            - {name: HOME, value: /tmp}
          envFrom:
            - secretRef: {name: {{ .Values.external.migrationSecret }}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
