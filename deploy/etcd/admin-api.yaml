Name: admin-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 10000

Jwt:
  AccessSecret: appforge-dev-jwt-secret-change-before-production
  AccessExpire: 86400

SystemRpc:
  Target: system-rpc:8080

CoreRpc:
  Target: core-rpc:8081

BuilderRpc:
  Target: builder-rpc:8082
  Middlewares:
    Duration: false

# 仅用于本地开发。生产环境必须由 Secret Manager 注入独立的 32 字节 Base64 密钥。
SigningSecrets:
  MasterKeyBase64: YXBwZm9yZ2UtZGV2LXNpZ25pbmcta2V5LTAwMDAwMSE=

# ClientId和ClientSecret必须由部署环境的Secret Manager覆盖；留空时连接按钮不可用。
SourceOAuth:
  SuccessRedirect: http://localhost:5174/platform/developer?tab=source
  WebhookBaseURL: http://localhost:8888/public/v1/source-webhooks
  GitHub:
    ClientId: ""
    ClientSecret: ""
    AuthorizeURL: https://github.com/login/oauth/authorize
    TokenURL: https://github.com/login/oauth/access_token
    ApiBaseURL: https://api.github.com
    RedirectURL: http://localhost:8888/public/v1/source-oauth/callback

  GitLab:
    ClientId: ""
    ClientSecret: ""
    AuthorizeURL: https://gitlab.com/oauth/authorize
    TokenURL: https://gitlab.com/oauth/token
    ApiBaseURL: https://gitlab.com/api/v4
    RedirectURL: http://localhost:8888/public/v1/source-oauth/callback

SourceTriggerWorker:
  Enabled: true
  WorkerId: source-trigger-worker-docker
  PollInterval: 2s
  LeaseSeconds: 600

# 生产环境在写入etcd前由Secret Manager注入；开发环境留空会禁用在线结账与支付回调。
Billing:
  StripeSecretKey: ""
  StripeWebhookSecret: whsec_appforge_dev_only_change_before_production
  StripeAPIBaseURL: https://api.stripe.com
  SuccessURL: http://localhost:5174/platform/billing?checkout=success
  CancelURL: http://localhost:5174/platform/billing?checkout=cancelled

# 生产环境启用独立9443监听，并配置服务端证书与Local Agent客户CA。
LocalAgentGateway:
  Enabled: false
  ListenOn: 0.0.0.0:9443
  ServerCertificate: ""
  ServerPrivateKey: ""
  ClientCACertificate: ""

# Dedicated/Private交付启用；状态文件必须位于持久卷。
OfflineLicense:
  Enabled: false
  LicenseFile: ""
  PublicKeyFile: ""
  StateFile: ""
  DeploymentId: ""
  DeploymentMode: ""
  ClockRollbackTolerance: 5m

# 只读展示的部署与兼容信息；生产环境由 Compose/Helm 环境变量覆盖。
Deployment:
  DeploymentId: local-development
  DeploymentMode: saas
  ProductVersion: 0.0.0-dev
  TargetSchemaVersion: 20260815_111_v7_deployment_console
  MaxVersionSkew: 1
  AgentProtocolCurrent: 3
  AgentProtocolMinimum: 2

# 仅记录会修改数据的后台操作；查询请求不写操作日志。
Audit:
  SIEM:
    Enabled: false
    Endpoint: ""
    BearerTokenFile: ""
    CACertificate: ""
    Timeout: 10s
    QueueSize: 1000
    MaxAttempts: 5
    RetryBackoff: 500ms
    AllowHTTP: false
