name: appforge-production

x-appforge-service: &appforge-service
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=512m,mode=1770,uid=65532,gid=65532
  networks:
    - appforge-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${APPFORGE_MYSQL_DATABASE:?required}
      MYSQL_USER: ${APPFORGE_MYSQL_USER:?required}
      MYSQL_PASSWORD: ${APPFORGE_MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${APPFORGE_MYSQL_ROOT_PASSWORD:?required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin=mysql-bin", "--binlog-expire-logs-seconds=604800"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [appforge-backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${APPFORGE_REDIS_PASSWORD:?required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [appforge-backend]

  etcd:
    image: quay.io/coreos/etcd:v3.6.12
    restart: unless-stopped
    command: ["/usr/local/bin/etcd", "--name=appforge-etcd", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd:2379"]
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [appforge-backend]

  etcd-init:
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/etcd-init:${APPFORGE_VERSION:?required}
    restart: "no"
    volumes:
      - ./runtime:/config:ro
    depends_on:
      etcd: {condition: service_healthy}
    networks: [appforge-backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${APPFORGE_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${APPFORGE_MINIO_SECRET_KEY:?required}
    command: ["server", "/data"]
    volumes:
      - object-data:/data
    networks: [appforge-backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    read_only: true
    user: "65532:65532"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ACCESS_KEY: ${APPFORGE_MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${APPFORGE_MINIO_SECRET_KEY:?required}
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=65532,gid=65532
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set appforge http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null; do sleep 2; done
        mc mb --ignore-existing appforge/appforge
        mc anonymous set none appforge/appforge
    depends_on:
      minio: {condition: service_started}
    networks: [appforge-backend]

  archive:
    image: alpine:3.22
    profiles: [tools]
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - object-data:/data
      - etcd-data:/etcd-data
    networks: [appforge-backend]

  migrate:
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/migrate:${APPFORGE_VERSION:?required}
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${APPFORGE_MYSQL_DATABASE:?required}
      MYSQL_USER: ${APPFORGE_MYSQL_USER:?required}
      MYSQL_PASSWORD: ${APPFORGE_MYSQL_PASSWORD:?required}
      APPFORGE_BOOTSTRAP_ADMIN_USERNAME: ${APPFORGE_BOOTSTRAP_ADMIN_USERNAME:?required}
      APPFORGE_BOOTSTRAP_PASSWORD_BCRYPT_BASE64: ${APPFORGE_BOOTSTRAP_PASSWORD_BCRYPT_BASE64:?required}
      APPFORGE_PUBLIC_ORIGIN: ${APPFORGE_PUBLIC_ORIGIN:?required}
      APPFORGE_MINIO_ACCESS_KEY: ${APPFORGE_MINIO_ACCESS_KEY:?required}
      APPFORGE_MINIO_SECRET_KEY: ${APPFORGE_MINIO_SECRET_KEY:?required}
    command: ["--expected=20260815_111_v7_deployment_console"]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [appforge-backend]

  system-rpc:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/system:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      etcd-init: {condition: service_completed_successfully}

  core-rpc:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/core:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379"]
    volumes:
      - ${APPFORGE_LOCAL_AGENT_CA_CERT_FILE:?required}:/etc/appforge/agent-ca.crt:ro
      - ${APPFORGE_LOCAL_AGENT_CA_KEY_FILE:?required}:/etc/appforge/agent-ca.key:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      etcd-init: {condition: service_completed_successfully}

  builder-rpc:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/builder:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379"]
    depends_on:
      core-rpc: {condition: service_started}

  builder-worker:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/builder-worker:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379"]
    environment:
      APPFORGE_BUILDER_ID: builder-production-1
      APPFORGE_BUILDER_ENDPOINT: builder-worker
    depends_on:
      builder-rpc: {condition: service_started}
      minio-init: {condition: service_completed_successfully}

  webhook-worker:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/core:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379", "-role", "webhook-worker"]
    volumes:
      - ${APPFORGE_LOCAL_AGENT_CA_CERT_FILE:?required}:/etc/appforge/agent-ca.crt:ro
      - ${APPFORGE_LOCAL_AGENT_CA_KEY_FILE:?required}:/etc/appforge/agent-ca.key:ro
    depends_on:
      core-rpc: {condition: service_started}

  billing-worker:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/core:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379", "-role", "billing-worker"]
    volumes:
      - ${APPFORGE_LOCAL_AGENT_CA_CERT_FILE:?required}:/etc/appforge/agent-ca.crt:ro
      - ${APPFORGE_LOCAL_AGENT_CA_KEY_FILE:?required}:/etc/appforge/agent-ca.key:ro
    depends_on:
      core-rpc: {condition: service_started}

  enterprise-worker:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/core:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379", "-role", "enterprise-worker"]
    volumes:
      - ${APPFORGE_LOCAL_AGENT_CA_CERT_FILE:?required}:/etc/appforge/agent-ca.crt:ro
      - ${APPFORGE_LOCAL_AGENT_CA_KEY_FILE:?required}:/etc/appforge/agent-ca.key:ro
    depends_on:
      core-rpc: {condition: service_started}

  api:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/api:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379"]
    ports:
      - "${APPFORGE_LOCAL_AGENT_GATEWAY_PORT:-9443}:9443"
    environment:
      APPFORGE_SIEM_ENDPOINT: ${APPFORGE_SIEM_ENDPOINT:?required}
      APPFORGE_SIEM_TOKEN_FILE: /etc/appforge/siem/token
      APPFORGE_SIEM_CA_FILE: /etc/appforge/siem/ca.crt
      APPFORGE_DEPLOYMENT_ID: ${APPFORGE_DEPLOYMENT_ID:?required}
      APPFORGE_DEPLOYMENT_MODE: ${APPFORGE_DEPLOYMENT_MODE:?required}
      APPFORGE_VERSION: ${APPFORGE_VERSION:?required}
      APPFORGE_SCHEMA_VERSION: ${APPFORGE_SCHEMA_VERSION:-20260815_111_v7_deployment_console}
      APPFORGE_MAX_VERSION_SKEW: ${APPFORGE_MAX_VERSION_SKEW:-1}
    volumes:
      - ${APPFORGE_TLS_CERT_FILE:?required}:/etc/appforge/tls/tls.crt:ro
      - ${APPFORGE_TLS_KEY_FILE:?required}:/etc/appforge/tls/tls.key:ro
      - ${APPFORGE_LOCAL_AGENT_CA_CERT_FILE:?required}:/etc/appforge/agent-ca.crt:ro
      - ${APPFORGE_LICENSE_FILE:?required}:/etc/appforge/license/license.json:ro
      - ${APPFORGE_LICENSE_PUBLIC_KEY_FILE:?required}:/etc/appforge/license/vendor-public.pem:ro
      - license-state:/var/lib/appforge-license
      - ${APPFORGE_SIEM_TOKEN_FILE:?required}:/etc/appforge/siem/token:ro
      - ${APPFORGE_SIEM_CA_FILE:?required}:/etc/appforge/siem/ca.crt:ro
    depends_on:
      system-rpc: {condition: service_started}
      core-rpc: {condition: service_started}
      builder-rpc: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
    networks: [appforge-frontend, appforge-backend]

  source-trigger-worker:
    <<: *appforge-service
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/api:${APPFORGE_VERSION:?required}
    command: ["-etcd", "etcd:2379", "-role", "source-trigger-worker"]
    volumes:
      - ${APPFORGE_LICENSE_FILE:?required}:/etc/appforge/license/license.json:ro
      - ${APPFORGE_LICENSE_PUBLIC_KEY_FILE:?required}:/etc/appforge/license/vendor-public.pem:ro
      - license-state:/var/lib/appforge-license
    depends_on:
      core-rpc: {condition: service_started}
      etcd-init: {condition: service_completed_successfully}

  admin-web:
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/admin-ui:${APPFORGE_VERSION:?required}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    ports: ["${APPFORGE_ADMIN_HTTPS_PORT:-8443}:8443"]
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=101,gid=101
      - /var/cache/nginx:size=64m,mode=0770,uid=101,gid=101
    volumes:
      - ${APPFORGE_TLS_CERT_FILE:?required}:/etc/appforge/tls/tls.crt:ro
      - ${APPFORGE_TLS_KEY_FILE:?required}:/etc/appforge/tls/tls.key:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_started}
    networks: [appforge-frontend, appforge-backend]

  agent-web:
    image: ${APPFORGE_IMAGE_REGISTRY:?required}/agent-ui:${APPFORGE_VERSION:?required}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports: ["${APPFORGE_AGENT_HTTPS_PORT:-443}:8443"]
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=101,gid=101
      - /var/cache/nginx:size=64m,mode=0770,uid=101,gid=101
    volumes:
      - ${APPFORGE_TLS_CERT_FILE:?required}:/etc/appforge/tls/tls.crt:ro
      - ${APPFORGE_TLS_KEY_FILE:?required}:/etc/appforge/tls/tls.key:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_started}
    networks: [appforge-frontend, appforge-backend]

networks:
  appforge-frontend: {}
  appforge-backend:
    internal: true

volumes:
  mysql-data: {}
  redis-data: {}
  etcd-data: {}
  object-data: {}
  license-state: {}
