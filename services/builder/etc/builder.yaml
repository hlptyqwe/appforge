Name: builder.rpc
ListenOn: 0.0.0.0:8082
Mode: dev
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: builder.rpc
CoreRpc:
  Target: 127.0.0.1:8081
BuilderRpc:
  Target: 127.0.0.1:8082
Builder:
  Id: builder-local
  PoolCode: default
  Endpoint: local
  MaxConcurrency: 2
  LeaseSeconds: 120
  PollInterval: 2s
  NodeHeartbeat: 15s
  TempDir: /tmp/appforge-builder
  ToolchainVersion: android-debian-v4
  BuildProtocolVersion: 1
  CapabilityJson: '{"apk":true,"branding":true,"whiteLabel":true,"cache":true}'
  CacheTtl: 168h

ObjectCleanup:
  Interval: 5m
  StaleAfter: 30m
  BatchSize: 100

ObjectStorage:
  OssType: 3
  Minio:
    Endpoint: http://127.0.0.1:9000
    BucketUrl: http://127.0.0.1:9000/appforge
    AccessKeyId: appforge
    AccessKeySecret: appforge_dev_minio
    BucketName: appforge

SigningSecrets:
  MasterKeyBase64: YXBwZm9yZ2UtZGV2LXNpZ25pbmcta2V5LTAwMDAwMSE=

SecretProviders:
  MaxSecretBytes: 65536
  LocalRoot: ""
  KubernetesRoot: ""
  Vault:
    Address: ""
    TokenFile: ""
    Namespace: ""
    AllowHTTP: false
  AWS:
    Region: ""
    Endpoint: ""
